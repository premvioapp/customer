<p class="small muted">Last updated 2 November 2026</p>
<p>These terms are an agreement between you and Premvio (premvio.app). By creating an account or using Premvio, you agree to them. If you do not agree, please do not use Premvio.</p>
<h3>1. Who can use Premvio</h3>
<ul><li>You must be at least 18 years old, or use Premvio with permission from a parent or guardian.</li>
<li>One account per person. The details you give (name, Gmail, phone, country) must be true and your own.</li>
<li>Premvio is an independent seller. We are not part of, or approved by, Telegram, PUBG, or any game or app company.</li></ul>
<h3>2. Your account</h3>
<ul><li>Keep your password and app PIN secret. You are responsible for everything done with your account.</li>
<li>Premvio staff will never ask for your password, PIN or Telegram login code.</li>
<li>Tell us at once if you think someone else is using your account.</li></ul>
<h3>3. Balance and deposits</h3>
<ul><li>You add money only through the payment methods shown in the app, and give true payment details (amount, transaction ID, sender name).</li>
<li>Your balance is for buying on Premvio. It is not a bank account and earns no interest.</li>
<li>Fake or reused payment details are rejected, and the account may be blocked.</li></ul>
<h3>4. Orders and delivery</h3>
<ul><li>Check your order details (for example your Telegram username or game Player ID) before you confirm. We deliver to the details you give.</li>
<li>Prices are shown before you pay. We may change prices for future orders at any time.</li>
<li>We try to deliver quickly, but delivery times are not guaranteed.</li></ul>
<h3>5. Withdrawals</h3>
<ul><li>To withdraw, your KYC (identity check) must be approved.</li>
<li>The minimum withdrawal is NPR 100. A withdrawal code is valid for 24 hours. If it is not used in time, the money goes back to your balance automatically.</li></ul>
<h3>6. Offers, codes, points and giveaways</h3>
<ul><li>Promo codes, bonuses, points, invite rewards and giveaways follow the rules shown with each one.</li>
<li>Premvio may change or end any offer. Rewards gained by cheating (for example many accounts) are removed.</li></ul>
<h3>7. Not allowed</h3>
<ul><li>Fraud, fake payments, chargebacks, or using someone else's money or identity</li>
<li>Creating several accounts to misuse offers</li>
<li>Using Premvio for anything illegal</li>
<li>Abusing or threatening Premvio staff or agents</li></ul>
<p>If you break these rules, we may cancel orders, remove rewards, hold the balance while we check, or block the account.</p>
<h3>8. Our responsibility</h3>
<p>We do our best to keep Premvio working and safe. We are not responsible for losses caused by wrong details you give, by a game or app company's own rules or outages, or by events outside our control. Where Nepal law allows, our responsibility for any order is limited to the amount you paid for it.</p>
<h3>9. Changes</h3>
<p>We may update these terms. We will show the new version in the app, and you will be asked to agree again.</p>
<h3>10. Law and contact</h3>
<p>These terms follow the laws of Nepal. Questions: use Help chat in the app, or email premvioapp@gmail.com.</p>`},privacy:{title:"Privacy Policy",body:`
<p class="small muted">Last updated 2 November 2026</p>
<p>This policy explains what information Premvio keeps about you, why, and how we protect it.</p>
<h3>1. What we collect</h3>
<ul><li><b>Account:</b> name, Gmail, phone number, country, and your password (stored only in protected, scrambled form).</li>
<li><b>Identity check (KYC):</b> the details and ID photos you upload for verification.</li>
<li><b>Orders and money:</b> deposits, payment details, orders, withdrawals, balance, points and rewards.</li>
<li><b>Delivery details:</b> what you type into order forms (for example a Telegram username, game Player ID, city or street).</li>
<li><b>Support:</b> your help chats with our team.</li>
<li><b>Device:</b> a device ID and device name, to keep your account safe, and your choices such as theme and notifications.</li></ul>
<h3>2. Why we use it</h3>
<ul><li>To create your account, deliver orders, handle deposits, withdrawals and refunds</li>
<li>To prevent fraud and keep accounts safe</li>
<li>To answer your help chats and send notifications you allowed</li>
<li>To follow the law in Nepal</li></ul>
<h3>3. Who can see it</h3>
<ul><li>Only Premvio staff who need it for their work. Our staff sign a confidentiality agreement.</li>
<li>Trusted services that run Premvio: Supabase (secure database and file storage), Cloudflare (human check, security) and Google (email). They may only use it to provide their service.</li>
<li>Authorities, only when the law requires it.</li>
<li>We never sell your information.</li></ul>
<h3>4. How we protect it</h3>
<p>Your data is stored in a protected database with access rules, ID photos are in a private store, and staff use two-step login. No system is 100% safe, so please also keep your password and PIN secret.</p>
<h3>5. How long we keep it</h3>
<p>We keep your information while your account is open, and records of payments and orders for as long as Nepal law requires for business records. After that we delete it.</p>
<h3>6. Your choices</h3>
<ul><li>See and correct your details in Settings.</li>
<li>Ask for a copy of your data, or for your account to be deleted, through Help chat or premvioapp@gmail.com.</li>
<li>Turn notifications on or off any time in Settings.</li></ul>
<h3>7. Storage on your device</h3>
<p>The app saves small settings on your device (for example language, theme and login session) so it works properly. We do not use advertising trackers.</p>
<h3>8. Contact</h3>
<p>Privacy questions: Help chat in the app, or premvioapp@gmail.com.</p>`},refund:{title:"Refund Policy",body:`
<p class="small muted">Last updated 2 November 2026</p>
<p>Premvio sells digital items that are delivered to the details you give. This policy explains when you can get your money back.</p>
<h3>1. Orders you can refund</h3>
<ul><li>An order that is still <b>pending</b> (not delivered yet) can be refunded.</li>
<li>Open the order in <b>History</b>, tap <b>Request refund</b>, and tell us why.</li>
<li>Our team checks the request. If approved, the full amount goes back to your <b>Premvio balance</b>.</li>
<li>Each order can be refunded once. A rejected request cannot be sent again.</li></ul>
<h3>2. Orders you cannot refund</h3>
<ul><li>Orders that are already <b>completed</b> (delivered)</li>
<li>Orders delivered to wrong details you entered (for example a wrong username or Player ID)</li>
<li>Free products, gifts already delivered, and bonus or promo amounts</li></ul>
<h3>3. If we cannot deliver</h3>
<p>If we cannot deliver your order, we cancel it and return the full amount to your Premvio balance.</p>
<h3>4. Withdrawals</h3>
<p>If a withdrawal code is not used within 24 hours, the money returns to your Premvio balance automatically.</p>
<h3>5. Deposits</h3>
<ul><li>Money added to your balance can be used for orders, or taken out as a withdrawal once your KYC is approved.</li>
<li>Deposits that cannot be confirmed (wrong amount, fake or reused transaction ID) are rejected and not added.</li>
<li>If you paid but the deposit was rejected by mistake, contact us through Help chat with your payment details.</li></ul>
<h3>6. Contact</h3>
