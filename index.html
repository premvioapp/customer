<!doctype html>
<html lang="en" data-theme="dark">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#060b1a">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;600;700;800&display=swap" rel="stylesheet">
<style>body{background:#060b1a;color:#eef3ff}</style>
<script>
function pvOffline(){var r=document.getElementById('root');if(!r)return;r.innerHTML='<div class="offline-screen" style="min-height:80vh;display:grid;place-items:center;text-align:center;font-family:system-ui,sans-serif;color:#eef3ff"><div><svg viewBox="0 0 24 24" width="48" height="48" fill="none" stroke="#8d9bbd" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M2 2l20 20"/><path d="M8.5 16.4a5 5 0 0 1 7 0"/><path d="M5 12.9a10 10 0 0 1 5.2-2.8"/><path d="M19 12.9a10 10 0 0 0-2.6-1.8"/><path d="M2 8.8a15 15 0 0 1 4.2-2.7"/><path d="M22 8.8A15 15 0 0 0 11 4.4"/><circle cx="12" cy="20" r="1"/></svg><p style="margin:12px 0 0;font-weight:700">No internet connection</p></div></div>';window.pvDead=true;window.addEventListener('online',function(){location.reload();});}
function pvFatal(m){var r=document.getElementById('root');if(!r)return;r.innerHTML='<div style="max-width:460px;margin:60px auto;padding:20px;border-radius:14px;background:#2a0f16;color:#ffd7dc;font-family:system-ui,sans-serif;line-height:1.5"><b style="font-size:1.1rem">Premvio could not start</b><p style="margin:10px 0 0">'+String(m).replace(/</g,'&lt;')+'</p></div>';window.pvDead=true;}
window.addEventListener('error',function(e){if(e.message&&!window.pvDead)pvFatal(e.message+' — '+String(e.filename||'').split('/').pop()+' line '+e.lineno);},true);
window.addEventListener('unhandledrejection',function(e){var m=(e.reason&&e.reason.message)||String(e.reason);var net=!navigator.onLine||/fetch|network|load failed/i.test(m);if(net){if(!document.querySelector('#root .card, #root .app, #root .panel, #root .auth-wrap'))pvOffline();return;}if(!document.querySelector('#root .card, #root .app, #root .panel'))pvFatal(m);});
</script>
<style>
/* ============ PREMVIO — shared styles ============ */
:root {
  --bg: #060b1a;
  --bg-2: #0b1328;
  --card: #0f1a33;
  --card-2: #142243;
  --line: rgba(120, 160, 255, .14);
  --text: #eef3ff;
  --muted: #8d9bbd;
  --blue: #1fa2ff;
  --blue-2: #2f6bff;
  --grad: linear-gradient(135deg, #1fb4ff 0%, #2f6bff 100%);
  --gold: #ffc83d;
  --green: #22c983;
  --red: #ff5d6c;
  --orange: #ff9f43;
  --radius: 16px;
  --shadow: 0 10px 30px rgba(0, 0, 0, .35);
  --nav-h: 68px;
  color-scheme: dark;
}
:root[data-theme="light"] {
  --bg: #f2f5fc;
  --bg-2: #e8eef9;
  --card: #ffffff;
  --card-2: #f4f7fe;
  --line: rgba(30, 60, 140, .12);
  --text: #0c1530;
  --muted: #5d6a8a;
  --shadow: 0 8px 24px rgba(20, 40, 100, .10);
  color-scheme: light;
}

* { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
html, body { margin: 0; }
body {
  font-family: "Plus Jakarta Sans", system-ui, -apple-system, Segoe UI, Roboto, sans-serif;
  background: var(--bg);
  color: var(--text);
  font-size: 15px;
  line-height: 1.5;
  min-height: 100vh;
}
a { color: var(--blue); text-decoration: none; }
img { max-width: 100%; display: block; }
h1, h2, h3 { margin: 0 0 .4em; line-height: 1.2; }
h2 { font-size: 1.25rem; }
h3 { font-size: 1.05rem; }
p { margin: 0 0 .6em; }
.muted { color: var(--muted); }
.small { font-size: .85rem; }
.hidden { display: none !important; }
.row { display: flex; gap: 10px; align-items: center; }
.row.wrap { flex-wrap: wrap; }
.between { justify-content: space-between; }
.grow { flex: 1; }
.mt { margin-top: 14px; }
.mb { margin-bottom: 14px; }
.center { text-align: center; }
.mono { font-family: ui-monospace, SFMono-Regular, Menlo, monospace; letter-spacing: .04em; }

/* ---------- inputs & buttons ---------- */
label { display: block; font-size: .85rem; color: var(--muted); margin: 12px 0 6px; font-weight: 600; }
input, select, textarea {
  width: 100%;
  padding: 13px 14px;
  border-radius: 12px;
  border: 1px solid var(--line);
  background: var(--bg-2);
  color: var(--text);
  font: inherit;
  outline: none;
  transition: border-color .15s, box-shadow .15s;
}
textarea { min-height: 96px; resize: vertical; }
input:focus, select:focus, textarea:focus { border-color: var(--blue); box-shadow: 0 0 0 3px rgba(31, 162, 255, .18); }
.btn {
  display: inline-flex; align-items: center; justify-content: center; gap: 8px;
  padding: 12px 18px; border-radius: 12px; border: 0; cursor: pointer;
  font: inherit; font-weight: 700; color: #fff; background: var(--grad);
  transition: transform .1s, opacity .15s, filter .15s;
}
.btn:hover { filter: brightness(1.08); }
.btn:active { transform: scale(.98); }
.btn:disabled { opacity: .55; cursor: not-allowed; }
.btn.block { width: 100%; }
.btn.ghost { background: transparent; color: var(--text); border: 1px solid var(--line); }
.btn.soft { background: var(--card-2); color: var(--text); }
.btn.gold { background: linear-gradient(135deg, #ffd45e, #ffaa1f); color: #241600; }
.btn.danger { background: var(--red); }
.btn.success { background: var(--green); }
.btn.sm { padding: 8px 12px; font-size: .85rem; border-radius: 10px; }
.icon-btn {
  width: 42px; height: 42px; border-radius: 12px; border: 1px solid var(--line);
  background: var(--card); color: var(--text); display: grid; place-items: center; cursor: pointer; position: relative;
}
.icon-btn svg, .btn svg, .nav-item svg { width: 20px; height: 20px; }
.dot {
  position: absolute; top: 6px; right: 6px; min-width: 16px; height: 16px; padding: 0 4px;
  border-radius: 8px; background: var(--red); color: #fff; font-size: 10px; font-weight: 800;
  display: grid; place-items: center;
}

/* ---------- cards & badges ---------- */
.card {
  background: var(--card); border: 1px solid var(--line); border-radius: var(--radius);
  padding: 18px; box-shadow: var(--shadow);
}
.card + .card { margin-top: 14px; }
.badge {
  display: inline-flex; align-items: center; gap: 4px;
  font-size: .75rem; font-weight: 700; padding: 3px 10px; border-radius: 999px;
  background: var(--card-2); color: var(--muted); text-transform: capitalize; white-space: nowrap;
}
.badge.pending  { background: rgba(255, 159, 67, .15); color: var(--orange); }
.badge.completed, .badge.approved, .badge.active { background: rgba(34, 201, 131, .15); color: var(--green); }
.badge.cancelled, .badge.rejected, .badge.expired, .badge.blocked { background: rgba(255, 93, 108, .15); color: var(--red); }
.badge.admin { background: rgba(255, 200, 61, .15); color: var(--gold); }
.badge.agent { background: rgba(31, 162, 255, .15); color: var(--blue); }

/* ---------- auth ---------- */
.auth-wrap { min-height: 100vh; display: grid; place-items: center; padding: 24px 16px; }
.auth-box { width: 100%; max-width: 420px; }
.auth-logo { width: 132px; margin: 0 auto 12px; filter: drop-shadow(0 10px 30px rgba(31, 162, 255, .35)); }
.tabs { display: flex; background: var(--bg-2); border-radius: 12px; padding: 4px; margin-bottom: 8px; }
.tabs button {
  flex: 1; border: 0; background: transparent; color: var(--muted); padding: 10px; border-radius: 9px;
  font: inherit; font-weight: 700; cursor: pointer;
}
.tabs button.on { background: var(--card); color: var(--text); box-shadow: var(--shadow); }
.captcha { display: flex; gap: 10px; align-items: center; }
.captcha .q {
  flex: 0 0 auto; padding: 12px 14px; border-radius: 12px; background: var(--card-2);
  font-weight: 800; letter-spacing: .05em; user-select: none; border: 1px dashed var(--line);
}
.link-btn { background: none; border: 0; color: var(--blue); font: inherit; cursor: pointer; padding: 0; font-weight: 600; }

/* ---------- customer app shell ---------- */
.app { max-width: 560px; margin: 0 auto; padding: 0 16px calc(var(--nav-h) + 28px); }
.topbar {
  position: sticky; top: 0; z-index: 20; display: flex; align-items: center; gap: 12px;
  padding: 12px 0; background: linear-gradient(var(--bg) 70%, transparent);
}
.topbar img { width: 40px; height: 40px; }
.topbar .title { font-weight: 800; font-size: 1.15rem; }
.view { animation: fade .25s ease; }
@keyframes fade { from { opacity: 0; transform: translateY(6px); } to { opacity: 1; transform: none; } }

.bottom-nav {
  position: fixed; left: 0; right: 0; bottom: 0; z-index: 30;
  height: calc(var(--nav-h) + env(safe-area-inset-bottom)); padding-bottom: env(safe-area-inset-bottom);
  background: color-mix(in srgb, var(--card) 92%, transparent); backdrop-filter: blur(14px);
  border-top: 1px solid var(--line); display: flex; justify-content: center;
}
.bottom-nav .inner { display: flex; width: 100%; max-width: 560px; }
.nav-item {
  flex: 1; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 3px;
  background: none; border: 0; color: var(--muted); font: inherit; font-size: .72rem; font-weight: 700; cursor: pointer;
}
.nav-item.on { color: var(--blue); }
.nav-item.on svg { filter: drop-shadow(0 0 8px rgba(31, 162, 255, .6)); }

.balance-card {
  position: relative; overflow: hidden; border-radius: 22px; padding: 20px; color: #fff;
  background: radial-gradient(circle at 85% 10%, rgba(255, 200, 61, .35), transparent 40%), var(--grad);
  box-shadow: 0 16px 40px rgba(47, 107, 255, .35);
}
.balance-card .label { opacity: .85; font-size: .85rem; font-weight: 600; }
.balance-card .amount { font-size: 2rem; font-weight: 800; margin: 4px 0 12px; letter-spacing: -.02em; }
.balance-card .btn { background: rgba(255, 255, 255, .18); backdrop-filter: blur(6px); }
.balance-card .member { font-size: .8rem; opacity: .9; }

.products { display: grid; grid-template-columns: repeat(2, 1fr); gap: 12px; }
.product {
  background: var(--card); border: 1px solid var(--line); border-radius: var(--radius); overflow: hidden;
  cursor: pointer; transition: transform .15s, border-color .15s; text-align: left; padding: 0; color: inherit; font: inherit;
}
.product:hover { transform: translateY(-2px); border-color: var(--blue); }
.product .ph { aspect-ratio: 1; background: var(--card-2); display: grid; place-items: center; overflow: hidden; }
.product .ph img { width: 100%; height: 100%; object-fit: cover; }
.product .info { padding: 10px 12px 12px; }
.product .name { font-weight: 700; font-size: .92rem; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
.product .price { color: var(--gold); font-weight: 800; margin-top: 4px; }

.feature { display: flex; gap: 14px; }
.feature img { width: 72px; height: 72px; border-radius: 12px; object-fit: cover; flex: 0 0 auto; }

.list-item {
  display: flex; align-items: center; gap: 12px; padding: 12px 0; border-bottom: 1px solid var(--line);
}
.list-item:last-child { border-bottom: 0; }
.list-item .ic {
  width: 40px; height: 40px; border-radius: 12px; display: grid; place-items: center; flex: 0 0 auto;
  background: var(--card-2); font-size: 1.1rem;
}
.amt-pos { color: var(--green); font-weight: 800; white-space: nowrap; }
.amt-neg { color: var(--red); font-weight: 800; white-space: nowrap; }

.chips { display: flex; gap: 8px; overflow-x: auto; padding-bottom: 4px; margin-bottom: 12px; }
.chip {
  border: 1px solid var(--line); background: var(--card); color: var(--muted); padding: 7px 14px; border-radius: 999px;
  font: inherit; font-size: .85rem; font-weight: 700; cursor: pointer; white-space: nowrap;
}
.chip.on { background: var(--grad); color: #fff; border-color: transparent; }

.code-box {
  text-align: center; padding: 18px; border-radius: 16px; border: 2px dashed var(--gold);
  background: rgba(255, 200, 61, .06);
}
.code-box .code { font-size: 2rem; font-weight: 800; letter-spacing: .18em; color: var(--gold); }

.setting-row { display: flex; align-items: center; justify-content: space-between; gap: 12px; padding: 12px 0; border-bottom: 1px solid var(--line); }
.setting-row:last-child { border-bottom: 0; }
.switch { position: relative; width: 50px; height: 28px; flex: 0 0 auto; }
.switch input { opacity: 0; width: 0; height: 0; }
.switch span { position: absolute; inset: 0; background: var(--card-2); border: 1px solid var(--line); border-radius: 999px; cursor: pointer; transition: .2s; }
.switch span::after { content: ""; position: absolute; width: 22px; height: 22px; left: 2px; top: 2px; border-radius: 50%; background: #fff; transition: .2s; }
.switch input:checked + span { background: var(--blue); }
.switch input:checked + span::after { transform: translateX(22px); }

.empty { text-align: center; color: var(--muted); padding: 34px 10px; }
.empty .big { font-size: 2.2rem; margin-bottom: 6px; }

/* ---------- modal & toast ---------- */
.modal-bg {
  position: fixed; inset: 0; z-index: 100; background: rgba(2, 6, 18, .65); backdrop-filter: blur(4px);
  display: flex; align-items: flex-end; justify-content: center; animation: fadeBg .2s;
}
@keyframes fadeBg { from { opacity: 0; } }
.modal {
  width: 100%; max-width: 560px; max-height: 92vh; overflow-y: auto;
  background: var(--card); border: 1px solid var(--line); border-radius: 22px 22px 0 0;
  padding: 20px 18px calc(20px + env(safe-area-inset-bottom)); animation: up .25s ease;
}
@keyframes up { from { transform: translateY(40px); opacity: 0; } }
@media (min-width: 700px) {
  .modal-bg { align-items: center; }
  .modal { border-radius: 22px; }
}
.modal .close { float: right; }
.modal .hero { width: 100%; max-height: 300px; object-fit: cover; border-radius: 14px; margin-bottom: 14px; }

#toasts { position: fixed; top: 14px; left: 50%; transform: translateX(-50%); z-index: 200; display: grid; gap: 8px; width: min(92vw, 420px); }
.toast {
  background: var(--card); color: var(--text); border: 1px solid var(--line); border-left: 4px solid var(--blue);
  padding: 12px 14px; border-radius: 12px; box-shadow: var(--shadow); font-weight: 600; animation: up .2s;
}
.toast.error { border-left-color: var(--red); }
.toast.success { border-left-color: var(--green); }

.loader { width: 28px; height: 28px; border: 3px solid var(--line); border-top-color: var(--blue); border-radius: 50%; animation: spin .8s linear infinite; margin: 30px auto; }
@keyframes spin { to { transform: rotate(360deg); } }

/* ---------- admin / agent layout ---------- */
.panel { display: flex; min-height: 100vh; }
.sidebar {
  width: 250px; flex: 0 0 auto; background: var(--card); border-right: 1px solid var(--line);
  padding: 18px 12px; position: sticky; top: 0; height: 100vh; overflow-y: auto;
}
.sidebar .brand { display: flex; align-items: center; gap: 10px; padding: 0 8px 18px; font-weight: 800; }
.sidebar .brand img { width: 40px; }
.side-link {
  display: flex; align-items: center; gap: 10px; width: 100%; padding: 11px 12px; border-radius: 10px;
  border: 0; background: none; color: var(--muted); font: inherit; font-weight: 700; cursor: pointer; text-align: left;
}
.side-link:hover { background: var(--card-2); color: var(--text); }
.side-link.on { background: var(--grad); color: #fff; }
.side-link .count { margin-left: auto; background: var(--red); color: #fff; border-radius: 999px; font-size: .7rem; padding: 1px 7px; }
.panel-main { flex: 1; min-width: 0; padding: 22px; }
.panel-top { display: flex; align-items: center; gap: 12px; margin-bottom: 18px; }
.panel-top h1 { font-size: 1.4rem; margin: 0; }
.menu-btn { display: none; }
.stats { display: grid; grid-template-columns: repeat(auto-fill, minmax(180px, 1fr)); gap: 12px; }
.stat { background: var(--card); border: 1px solid var(--line); border-radius: var(--radius); padding: 16px; }
.stat .k { color: var(--muted); font-size: .8rem; font-weight: 700; }
.stat .v { font-size: 1.5rem; font-weight: 800; margin-top: 4px; }
.table-wrap { overflow-x: auto; border-radius: var(--radius); border: 1px solid var(--line); background: var(--card); }
table { width: 100%; border-collapse: collapse; font-size: .9rem; }
th, td { padding: 11px 12px; text-align: left; border-bottom: 1px solid var(--line); vertical-align: middle; }
th { color: var(--muted); font-size: .75rem; text-transform: uppercase; letter-spacing: .05em; background: var(--card-2); white-space: nowrap; }
tr:last-child td { border-bottom: 0; }
td .btn + .btn { margin-left: 6px; }
.thumb { width: 44px; height: 44px; border-radius: 10px; object-fit: cover; background: var(--card-2); }
.toolbar { display: flex; gap: 10px; flex-wrap: wrap; align-items: center; margin-bottom: 14px; }
.toolbar input, .toolbar select { width: auto; flex: 1; min-width: 160px; }
.grid-2 { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
@media (max-width: 860px) {
  .sidebar { position: fixed; left: 0; top: 0; z-index: 50; transform: translateX(-100%); transition: transform .25s; box-shadow: var(--shadow); }
  .sidebar.open { transform: none; }
  .menu-btn { display: grid; }
  .panel-main { padding: 16px; }
  .grid-2 { grid-template-columns: 1fr; }
}

/* ---------- two-step login + KYC photo ---------- */
.qr-box { background: #fff; border-radius: 14px; padding: 12px; width: 220px; height: 220px; margin: 10px auto; display: grid; place-items: center; }
.qr-box img { width: 196px; height: 196px; }
.otp { font-family: ui-monospace, Menlo, monospace; font-size: 1.6rem; letter-spacing: .5em; text-align: center; }
.steps { padding-left: 20px; margin: 8px 0; } .steps li { margin: 6px 0; }
.doc-preview { margin-top: 10px; border-radius: 12px; max-height: 220px; object-fit: contain; background: var(--bg-2); width: 100%; }
.photo-ask { border: 1px dashed var(--orange); background: rgba(255, 159, 67, .07); border-radius: 12px; padding: 12px; margin-top: 12px; }

/* ---------- refunds ---------- */
.badge.refunded { background: rgba(31, 162, 255, .15); color: var(--blue); }
.badge.requested { background: rgba(255, 159, 67, .15); color: var(--orange); }
.refund-box { margin-top: 6px; padding: 8px 10px; border-radius: 10px; background: var(--card-2); font-size: .82rem; }

/* ---------- product search ---------- */
.search-box { position: relative; margin: 10px 0 14px; }
.search-box svg { position: absolute; left: 13px; top: 50%; transform: translateY(-50%); width: 18px; height: 18px; color: var(--muted); pointer-events: none; }
.search-box input { padding-left: 40px; padding-right: 40px; }
.search-box .clear { position: absolute; right: 6px; top: 50%; transform: translateY(-50%); width: 32px; height: 32px; border: 0;
  border-radius: 8px; background: transparent; color: var(--muted); cursor: pointer; display: grid; place-items: center; }
.search-box .clear svg { position: static; transform: none; }

/* ---------- searchable pick list (city / street) ---------- */
.ac { position: relative; }
.ac-list {
  position: absolute; left: 0; right: 0; top: calc(100% + 4px); z-index: 60; max-height: 240px; overflow-y: auto;
  background: var(--card); border: 1px solid var(--line); border-radius: 12px; box-shadow: var(--shadow); padding: 4px;
}
.ac-item { display: block; width: 100%; text-align: left; padding: 10px 12px; border: 0; background: none; color: var(--text);
  font: inherit; border-radius: 9px; cursor: pointer; }
.ac-item:hover, .ac-item.on { background: var(--card-2); }
.ac-item b { color: var(--blue); }
.ac-empty { padding: 10px 12px; color: var(--muted); font-size: .9rem; }

/* ---------- v2 additions ---------- */
.btn.deposit { background: linear-gradient(135deg, #2ee59d, #16b46f); color: #04220f; }
.btn.withdraw { background: linear-gradient(135deg, #ff6b78, #e23a4b); color: #fff; }
.money-actions { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
.bars { display: flex; align-items: flex-end; gap: 8px; height: 170px; padding: 10px 4px 0; }
.bars .b { flex: 1; display: flex; flex-direction: column; align-items: center; justify-content: flex-end; height: 100%; gap: 6px; min-width: 0; }
.bars .col { width: 100%; max-width: 38px; border-radius: 8px 8px 3px 3px; background: var(--grad); min-height: 3px; position: relative; }
.bars .val { font-size: .68rem; color: var(--muted); font-weight: 700; white-space: nowrap; }
.bars .day { font-size: .7rem; color: var(--muted); }
.field-row { border: 1px solid var(--line); border-radius: 12px; padding: 12px; margin-top: 10px; background: var(--bg-2); }
.field-row .row input, .field-row .row select { padding: 10px 12px; }
.info-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(160px, 1fr)); gap: 10px; }
.info-grid div { background: var(--card-2); border-radius: 12px; padding: 10px 12px; }
.info-grid .k { font-size: .75rem; color: var(--muted); font-weight: 700; }
.info-grid .v { font-weight: 700; word-break: break-word; }
.kv { font-size: .82rem; }
.kv span { color: var(--muted); }
.back-link { display: inline-flex; align-items: center; gap: 6px; margin-bottom: 12px; }

/* =====================================================================
   AGENT PANEL — its own look ("cashier desk"): graphite + emerald,
   Space Grotesk text, JetBrains Mono numbers. Scoped to body.agent-ui
   ===================================================================== */
.agent-ui {
  --bg: #0a0e13; --bg-2: #0f151c; --card: #121a22; --card-2: #19232d;
  --line: rgba(110, 231, 190, .13); --text: #e8f1ee; --muted: #84968f;
  --blue: #14d9a4; --blue-2: #0ea5a4; --grad: linear-gradient(135deg, #19e3ad 0%, #0ea5a4 100%);
  --radius: 12px; --shadow: 0 8px 22px rgba(0, 0, 0, .4);
  --mono: "JetBrains Mono", ui-monospace, SFMono-Regular, Menlo, monospace;
  font-family: "Space Grotesk", system-ui, sans-serif;
  background:
    radial-gradient(1200px 500px at 100% -10%, rgba(20, 217, 164, .08), transparent 60%),
    repeating-linear-gradient(0deg, transparent 0 31px, rgba(255, 255, 255, .018) 31px 32px),
    var(--bg);
  background-attachment: fixed;
}
.agent-ui .mono, .agent-ui .num, .agent-ui .amt-pos, .agent-ui .amt-neg { font-family: var(--mono); letter-spacing: 0; }
.agent-ui .card { border-radius: 12px; box-shadow: none; }

.agent-ui input, .agent-ui select { border-radius: 10px; }

.agent-ui .tabs { background: transparent; border-bottom: 1px solid var(--line); border-radius: 0; padding: 0; gap: 4px; }

/* header */
.desk-head { display: flex; align-items: center; gap: 12px; padding: 14px 0 12px; position: sticky; top: 0; z-index: 20;

.desk-sub { font-size: .78rem; color: var(--muted); font-family: var(--mono); }
.desk-head .icon-btn { border-radius: 10px; }

/* balance "register" display */
.register { position: relative; border: 1px solid var(--line); border-radius: 14px; overflow: hidden; margin-bottom: 14px;
  background: linear-gradient(180deg, #0f1a17 0%, #0d1419 100%); }
.register::before { content: ""; position: absolute; inset: 0 auto 0 0; width: 4px; background: var(--grad); }
.register .top { padding: 16px 18px 12px 22px; }
.register .lbl { font-size: .7rem; letter-spacing: .14em; text-transform: uppercase; color: var(--muted); font-weight: 600; }
.register .big { font-family: var(--mono); font-weight: 800; font-size: 2.1rem; color: #b8ffe8; margin-top: 2px;
  text-shadow: 0 0 22px rgba(20, 217, 164, .35); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.register .big small { font-size: .9rem; color: var(--muted); margin-right: 6px; text-shadow: none; }
.register .hint { font-size: .78rem; color: var(--muted); margin-top: 4px; }
.register .strip { display: grid; grid-template-columns: 1fr 1fr; border-top: 1px dashed var(--line); }
.register .strip > div { padding: 10px 18px 12px 22px; }
.register .strip > div + div { border-left: 1px dashed var(--line); padding-left: 18px; }
.register .strip .k { font-size: .68rem; letter-spacing: .1em; text-transform: uppercase; color: var(--muted); }
.register .strip .v { font-family: var(--mono); font-weight: 700; font-size: 1rem; margin-top: 2px; }
.register .strip .v.in { color: var(--green); } .register .strip .v.out { color: var(--red); }
.register .strip .c { font-family: var(--mono); font-size: .72rem; color: var(--muted); }

/* big action tiles */
.tiles { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-bottom: 16px; }
.tile { display: flex; flex-direction: column; align-items: flex-start; gap: 10px; padding: 16px; border-radius: 14px; cursor: pointer;
  border: 1px solid; font: inherit; text-align: left; transition: transform .1s, filter .15s; }
.tile:active { transform: scale(.98); }
.tile:hover { filter: brightness(1.1); }
.tile .ti { width: 40px; height: 40px; border-radius: 10px; display: grid; place-items: center; }
.tile .ti svg { width: 22px; height: 22px; }
.tile b { font-size: 1.05rem; }
.tile span { font-size: .78rem; opacity: .8; }
.tile.deposit { background: rgba(34, 201, 131, .1); border-color: rgba(34, 201, 131, .35); color: #b6f5d8; }
.tile.deposit .ti { background: var(--green); color: #03200f; }
.tile.withdraw { background: rgba(255, 93, 108, .1); border-color: rgba(255, 93, 108, .35); color: #ffd0d5; }
.tile.withdraw .ti { background: var(--red); color: #fff; }
.tile.on { outline: 2px solid currentColor; outline-offset: 2px; }

/* bigger mono inputs for codes and amounts */
.agent-ui input[name="code"], .agent-ui input[name="amount"] { font-family: var(--mono); font-size: 1.15rem; letter-spacing: .08em; }
.agent-ui .code-box { border-color: var(--blue); background: rgba(20, 217, 164, .06); }
.agent-ui .code-box .code { color: #b8ffe8; font-family: var(--mono); }
.agent-ui .setting-row b { font-weight: 600; }
.agent-ui .list-item .ic { border-radius: 10px; }

/* ---------- agent panel v2: avatar, screens, recent history ---------- */
.agent-ui .avatar-btn { width: 44px; height: 44px; flex: 0 0 auto; border-radius: 50%; border: 2px solid transparent; cursor: pointer; font-size: 1.45rem;
  display: grid; place-items: center; background: linear-gradient(var(--card), var(--card)) padding-box, var(--grad) border-box;
  box-shadow: 0 0 0 4px rgba(20, 217, 164, .08); transition: transform .12s; }
.agent-ui .avatar-btn:active { transform: scale(.94); }
.agent-ui .eye { background: none; border: 0; cursor: pointer; font-size: 1rem; opacity: .75; padding: 2px 4px; }
.agent-ui .eye:hover { opacity: 1; }
.recent-head { display: flex; align-items: center; justify-content: space-between; margin: 2px 0 8px; }
.recent-head b { font-size: .8rem; letter-spacing: .12em; text-transform: uppercase; color: var(--muted); }
.all-btn { display: inline-flex; align-items: center; gap: 8px; border: 1px solid var(--line); background: var(--card); color: var(--blue);
  font: inherit; font-weight: 700; font-size: .85rem; padding: 7px 12px; border-radius: 999px; cursor: pointer; transition: gap .15s, background .15s; }
.all-btn span { display: inline-grid; place-items: center; width: 22px; height: 22px; border-radius: 50%; background: var(--grad); color: #04140f; font-weight: 800; }

.agent-ui .recent { padding: 6px 14px; }
.agent-ui .ic.tx-in { background: rgba(34, 201, 131, .14); color: var(--green); font-weight: 800; }
.agent-ui .ic.tx-out { background: rgba(255, 93, 108, .14); color: var(--red); font-weight: 800; }
.screen-head { display: flex; align-items: center; gap: 12px; margin: 4px 0 14px; }
.back-btn { width: 42px; height: 42px; border-radius: 12px; border: 1px solid var(--line); background: var(--card); color: var(--text);
  font-size: 1.25rem; cursor: pointer; display: grid; place-items: center; transition: transform .12s, border-color .15s; }
.back-btn:hover { border-color: var(--blue); } .back-btn:active { transform: translateX(-3px); }
.slide-in { animation: slideIn .28s cubic-bezier(.2, .8, .2, 1); }
@keyframes slideIn { from { opacity: 0; transform: translateX(28px); } to { opacity: 1; transform: none; } }
.fade-in { animation: fade .25s ease; }
.profile-card { text-align: left; }
.big-avatar { width: 88px; height: 88px; margin: 4px auto 0; border-radius: 50%; display: grid; place-items: center; font-size: 2.8rem;
  background: linear-gradient(var(--card-2), var(--card-2)) padding-box, var(--grad) border-box; border: 3px solid transparent;
  box-shadow: 0 0 30px rgba(20, 217, 164, .25); }

/* ---------- customer: balance pill (top right) + wallet buttons + ID ---------- */
.bal-pill { display: inline-flex; align-items: center; gap: 8px; padding: 5px 5px 5px 12px; border-radius: 999px; text-decoration: none;

.wallet-btns { display: grid; gap: 10px; }
.wbtn { display: flex; align-items: center; gap: 14px; padding: 14px; border-radius: 14px; text-decoration: none; color: var(--text);

.id-row { display: flex; align-items: center; justify-content: space-between; gap: 10px; padding: 10px 12px; border-radius: 12px; background: var(--card-2); }

@media (max-width: 360px) { .topbar .small.muted#hello { display: none; } .bal-pill { font-size: .78rem; } }

/* ---------- cart ---------- */
.nav-item { position: relative; }
.nav-badge { position: absolute; top: 6px; left: calc(50% + 6px); min-width: 18px; height: 18px; padding: 0 5px; border-radius: 9px;

.cart-item .btn { white-space: nowrap; } .cart-item .grow { min-width: 0; }

/* ---------- payment methods ---------- */
.pm-card { display: flex; gap: 12px; align-items: flex-start; padding: 12px 0; border-bottom: 1px solid var(--line); }

.pm-info { white-space: pre-wrap; padding: 12px; border-radius: 12px; background: var(--card-2); font-weight: 600; border-left: 3px solid var(--blue); }
/* nicer file pickers (screenshots, KYC photo, logos) */
input[type="file"] { padding: 8px; cursor: pointer; }
input[type="file"]::file-selector-button { border: 0; padding: 10px 14px; margin-right: 12px; border-radius: 10px; cursor: pointer;
  background: var(--grad); color: #fff; font: inherit; font-weight: 700; }

/* ============ V21: moving message + pinned products ============ */
.ticker { display: flex; align-items: center; gap: 8px; margin: 4px 0 10px; padding: 8px 10px; border-radius: 12px;
  background: rgba(255, 200, 61, .10); border: 1px solid rgba(255, 200, 61, .35); overflow: hidden; }
.ticker .tk-ic { flex: none; font-size: 1rem; }

  animation: tk-ltr 15s linear infinite; will-change: transform; }
.tk-move.rtl { animation-name: tk-rtl; }
.ticker:hover .tk-move, .ticker:active .tk-move { animation-play-state: paused; }
@keyframes tk-ltr { from { transform: translateX(-100%); } to { transform: translateX(var(--tw, 100vw)); } }

@media (prefers-reduced-motion: reduce) {
  .tk-move { animation: none; white-space: normal; }

}
.sec-title { margin: 14px 0 8px; font-size: 1rem; }
.product .ph { position: relative; }
.product.pinned { border-color: rgba(255, 200, 61, .55); }
.pin-badge { position: absolute; top: 8px; left: 8px; max-width: calc(100% - 16px); overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
  background: var(--gold); color: #241600; font-size: .7rem; font-weight: 800; padding: 3px 8px; border-radius: 999px;
  box-shadow: 0 2px 8px rgba(0, 0, 0, .25); }

.product { display: flex; flex-direction: column; justify-content: flex-start; }

/* ============ V22: Marketing manager panel ============ */

.side-link svg { width: 20px; height: 20px; flex: none; }
.mk-ui .stats { grid-template-columns: repeat(auto-fill, minmax(150px, 1fr)); }
@media (max-width: 480px) { .mk-ui .stat .v { font-size: 1.2rem; } .mk-ui .stat { padding: 12px; } .mk-bars .val { display: none; } }

/* ============ V23: Agent Deposit Portal ============ */
.dp-app { padding-bottom: 40px; }

  background: linear-gradient(135deg, rgba(25, 227, 173, .14), rgba(14, 165, 164, .05)), var(--card); }

@keyframes dp-pop { from { transform: scale(.4); opacity: 0; } to { transform: scale(1); opacity: 1; } }
@media (prefers-reduced-motion: reduce) { .dp-check { animation: none; } }
/* agent desk: button to the deposit portal */
.tile-wide { display: flex; align-items: center; gap: 12px; padding: 14px 16px; margin: -6px 0 18px; border-radius: 14px; text-decoration: none;
  background: rgba(20, 217, 164, .08); border: 1px dashed rgba(20, 217, 164, .45); color: var(--text); }

/* admin: choose agents for an agent payment method */
.seg { display: flex; gap: 8px; flex-wrap: wrap; margin-bottom: 8px; }
.seg label { display: flex; align-items: center; gap: 8px; margin: 0; padding: 10px 14px; border: 1px solid var(--line); border-radius: 10px; color: var(--text); cursor: pointer; }

.ag-list { max-height: 240px; overflow-y: auto; border: 1px solid var(--line); border-radius: 10px; margin-top: 8px; }
.ag-row { display: flex; align-items: center; gap: 10px; margin: 0; padding: 9px 12px; border-bottom: 1px solid var(--line); color: var(--text); cursor: pointer; }
.ag-row:last-child { border-bottom: 0; }
.ag-row input { width: auto; margin: 0; }
.ag-row:hover { background: var(--card-2); }

/* ============ V26: promo codes + gift a friend ============ */
.promo-box { display: flex; gap: 8px; }

/* ============ V27: flash sale, stock, points, invites ============ */
.product .prices { margin-top: 4px; line-height: 1.3; }
.product .prices .price { color: var(--gold); font-weight: 800; }
.old-price { color: var(--muted); font-size: .8rem; }

.lo-dot { width: 7px; height: 7px; border-radius: 50%; background: var(--gold); animation: loPulse 1.4s infinite; }
@keyframes loPulse { 50% { opacity: .3; } }
.last-order em { font-style: normal; font-size: 1.4rem; color: var(--muted); }

.cat-chips { display: flex; gap: 8px; overflow-x: auto; margin: 2px -16px 8px; padding: 2px 16px 6px; scrollbar-width: none; }
.cat-chips::-webkit-scrollbar { display: none; }
.cat-chip { flex: none; padding: 8px 15px; border-radius: 999px; border: 1px solid var(--line); background: var(--card); color: var(--text);
  font: inherit; font-size: .85rem; font-weight: 600; cursor: pointer; white-space: nowrap; }
.cat-chip.on { background: var(--grad); border-color: transparent; color: #fff; box-shadow: 0 6px 16px rgba(47, 107, 255, .35); }

.sec-row-head { display: flex; align-items: center; justify-content: space-between; gap: 10px; }
.sec-row-head .sale-cd { font-size: .8rem; margin: 14px 0 8px; padding: 4px 10px; border-radius: 999px; background: rgba(255, 93, 108, .12); }
.h-row { display: flex; gap: 10px; overflow-x: auto; margin: 0 -16px 6px; padding: 2px 16px 8px; scroll-snap-type: x proximity; scrollbar-width: none; }
.h-row::-webkit-scrollbar { display: none; }
.h-row .product { flex: 0 0 42%; max-width: 180px; scroll-snap-align: start; }

/* product cards */
.product { position: relative; border-radius: 18px; box-shadow: 0 4px 14px rgba(0,0,0,.12); }
.product .ph { border-bottom: 1px solid var(--line); }
.product .ph-ic { color: var(--gold); width: 44px; }
.product .info { padding: 10px 12px 14px; padding-right: 44px; }
.product.mini .info { padding: 8px 10px 12px; padding-right: 40px; }
.product.mini .name { font-size: .84rem; }
.add-btn { position: absolute; right: 10px; bottom: 12px; width: 30px; height: 30px; border-radius: 10px; display: grid; place-items: center;
  background: var(--grad); color: #fff; font-weight: 800; font-size: 1.2rem; line-height: 1; box-shadow: 0 6px 14px rgba(47, 107, 255, .4); cursor: pointer; }
.add-btn:active { transform: scale(.88); }
.product.mini .add-btn { width: 26px; height: 26px; font-size: 1.05rem; right: 8px; bottom: 10px; }
:root[data-theme="light"] .product { box-shadow: 0 4px 14px rgba(20, 40, 100, .08); }
.hc-top > div:first-child { flex: 1; min-width: 0; }
.hc-bal { white-space: nowrap; font-size: clamp(1.35rem, 7vw, 1.75rem); }
.hc-add { padding: 7px 11px; font-size: .78rem; }
.h-row { scroll-padding-inline: 16px; }
.product.mini .prices { font-size: .8rem; }
.product.mini .prices .price { white-space: nowrap; }
.banner-admin { display: grid; grid-template-columns: repeat(auto-fill, minmax(280px, 1fr)); gap: 12px; }
.ba-item { padding: 10px; margin: 0; }
.ba-item img { width: 100%; aspect-ratio: 2 / 1; object-fit: cover; border-radius: 12px; display: block; background: var(--card-2); }
.ba-info { padding: 8px 4px 2px; }
.banner-prev { width: 100%; aspect-ratio: 2 / 1; object-fit: cover; border-radius: 12px; margin-bottom: 8px; background: var(--card-2); }

/* V41b: light quick buttons (no big blue card) */
.quick-row { display: flex; justify-content: space-between; gap: 6px; margin: 4px 0 14px; padding: 12px 8px; border-radius: 18px;
  background: var(--card); border: 1px solid var(--line); border-top: 1px solid var(--line); }
.q-btn { color: var(--text); }
.q-ic { width: 44px; height: 44px; border-radius: 14px; font-size: 1.25rem; border: 0; }
.q-dep .q-ic { background: rgba(34, 201, 131, .14); }
.q-wd .q-ic { background: rgba(255, 93, 108, .13); }
.q-vo .q-ic { background: rgba(255, 159, 67, .14); }
.q-in .q-ic { background: rgba(255, 200, 61, .14); }
.q-he .q-ic { background: rgba(31, 162, 255, .14); }
.q-lb { color: var(--muted); font-weight: 600; opacity: 1; }
.quick-row { justify-content: space-around; }
/* V42: agent delivery money summary */
.ao-sum { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; margin-bottom: 12px; }
.ao-sum:empty { display: none; }
.ao-sum > div { padding: 12px; border-radius: 14px; background: var(--card); border: 1px solid var(--line); }
.ao-sum span { display: block; font-size: .75rem; color: var(--muted); }
.ao-sum b { font-size: 1.05rem; }
.ao-sum .tue { border-color: rgba(255, 200, 61, .45); }
.ao-sum .tue b { color: var(--gold); }
.badge.tue { background: rgba(255, 200, 61, .15); color: var(--gold); }
/* V44: Cloudflare "I am human" check */
.ts-box { margin-top: 14px; min-height: 65px; }
.ts-fail { display: flex; align-items: center; justify-content: space-between; gap: 10px; padding: 12px; border-radius: 12px;
  border: 1px dashed var(--red); color: var(--red); font-size: .85rem; }
/* V46: bulk prices + delivery proof */
.tier-box { display: flex; flex-wrap: wrap; align-items: center; gap: 6px; margin: 10px 0 2px; padding: 9px 11px; border-radius: 12px; font-size: .8rem;
  background: rgba(34, 201, 131, .1); border: 1px solid rgba(34, 201, 131, .3); }
.tier-box b { color: var(--green); margin-right: 2px; }
.tier-box span { padding: 2px 8px; border-radius: 999px; background: var(--card); border: 1px solid var(--line); font-weight: 600; }
.proof-img { width: 100%; max-height: 60vh; object-fit: contain; border-radius: 12px; background: #000; margin-top: 8px; }
.log-details { max-width: 420px; word-break: break-word; }
.ord-btns { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 8px; }
.ord-btns .btn.sm { padding: 6px 10px; font-size: .78rem; }
.list-item:has(.ord-btns.full) { flex-wrap: wrap; }
.ord-btns.full { flex-basis: 100%; padding-left: 52px; margin-top: 2px; }
/* V47: Sell to Premvio */
.sell-grid { display: grid; grid-template-columns: repeat(2, 1fr); gap: 10px; }
.sell-card { display: flex; flex-direction: column; align-items: flex-start; gap: 4px; padding: 10px; border-radius: 16px; text-align: left; cursor: pointer;
  background: var(--card); border: 1px solid var(--line); color: var(--text); font: inherit; }
.sell-card:disabled { opacity: .5; cursor: not-allowed; }
.sell-card .sc-ph { width: 100%; aspect-ratio: 1; border-radius: 12px; background: var(--card-2); display: grid; place-items: center; font-size: 2rem; overflow: hidden; margin-bottom: 4px; }
.sell-card .sc-ph img { width: 100%; height: 100%; object-fit: cover; }
.sell-card b { font-size: .9rem; }
.sell-card small { color: var(--muted); font-size: .78rem; }
.sell-card small em { font-style: normal; color: var(--green); font-weight: 800; }
/* V48: line icons instead of emoji (Settings + Home buttons) */
.set-item .si-ic svg, .sp-title .si-ic svg { width: 20px; height: 20px; }
.si-ic.si-user { color: #4da3ff; background: rgba(77, 163, 255, .14); }
.si-ic.si-wallet { color: var(--green); background: rgba(34, 201, 131, .14); }
.si-ic.si-idcard { color: #a78bfa; background: rgba(167, 139, 250, .15); }
.si-ic.si-gift { color: #ff7aa2; background: rgba(255, 122, 162, .14); }
.si-ic.si-ticket { color: var(--orange); background: rgba(255, 159, 67, .14); }
.si-ic.si-sliders { color: #2dd4bf; background: rgba(45, 212, 191, .14); }
.si-ic.si-lock { color: var(--gold); background: rgba(255, 200, 61, .14); }
.si-ic.si-chat { color: var(--blue); background: rgba(31, 162, 255, .14); }
.si-ic.si-coins { color: var(--green); background: rgba(34, 201, 131, .14); }
.sp-title { display: flex; align-items: center; gap: 10px; margin: 0; }
.sp-title .si-ic { width: 34px; height: 34px; border-radius: 10px; display: grid; place-items: center; flex: 0 0 auto; }
.cat-chip.has-ic { display: inline-flex; align-items: center; gap: 6px; }
.cat-chip.has-ic svg { width: 15px; height: 15px; }
.cat-chip.cc-tag:not(.on) svg { color: var(--green); }
.cat-chip.cc-bolt:not(.on) svg { color: var(--red); }
.sell-card .sc-ph svg { width: 40px; height: 40px; color: var(--green); }
/* V49: "Info to copy" field */
.info-field { margin-top: 12px; padding: 10px 12px; border-radius: 12px; background: var(--bg-2); border: 1px dashed var(--line); }
.info-field .if-label { font-size: .8rem; color: var(--muted); font-weight: 600; margin-bottom: 4px; }
.info-field .if-row { display: flex; align-items: center; gap: 10px; }
.info-field .if-val { flex: 1; font-weight: 700; word-break: break-all; white-space: pre-wrap; }
/* V50: details shown under a chosen option */
.opt-info:empty { display: none; }
.opt-info .info-field { margin-top: 8px; border-style: solid; border-color: rgba(31, 162, 255, .35); }
.opt-edit { margin-top: 8px; }
.opt-edit .opt-info-in { margin-top: 6px; min-height: 38px; padding: 8px 10px; font-size: .85rem; resize: vertical; }
.info-field .if-val { word-break: normal; overflow-wrap: break-word; }
.sec-title.sec-ic { display: flex; align-items: center; gap: 6px; } .sec-title.sec-ic svg { width: 18px; height: 18px; color: var(--green); }
input[type="search"]::-webkit-search-cancel-button { -webkit-appearance: none; display: none; }
/* V52: product tap opens the order form directly */
.bm-head { display: flex; align-items: center; gap: 12px; padding-right: 44px; }
.bm-head img, .bm-head .bm-ph { width: 64px; height: 64px; border-radius: 14px; object-fit: cover; flex: 0 0 auto; background: var(--card-2); display: grid; place-items: center; }
.bm-head .bm-ph svg { width: 30px; color: var(--gold); }
.bm-head h2 { margin: 0; font-size: 1.15rem; }
.bm-desc { white-space: pre-wrap; margin: 10px 0 4px; }
/* V53: offline */
.net-bar { position: fixed; z-index: 700; left: 50%; transform: translateX(-50%); top: calc(10px + env(safe-area-inset-top, 0px));
  display: inline-flex; align-items: center; gap: 8px; padding: 8px 14px; border-radius: 999px; font-size: .82rem; font-weight: 700;
  background: #2a1218; color: #ffd7dc; border: 1px solid rgba(255, 93, 108, .45); box-shadow: 0 8px 22px rgba(0,0,0,.35); white-space: nowrap; }
.net-bar .nb-dot { width: 8px; height: 8px; border-radius: 50%; background: var(--red); }
.net-bar { top: auto; bottom: calc(var(--nav-h) + 14px + env(safe-area-inset-bottom, 0px)); }

<script>
if(!window.supabase)pvOffline();
else if(!window.PV_CONFIG)pvFatal('Settings are missing in this page. Re-upload the newest file.');
else if(!PV_CONFIG.SUPABASE_ANON_KEY||/PASTE/.test(PV_CONFIG.SUPABASE_ANON_KEY))pvFatal('The Supabase key is missing in this page.');
</script>
<script>
/* ============ PREMVIO — shared helpers ============ */
if (window.pvDead) throw new Error("stopped");
const CFG = window.PV_CONFIG;
// Each panel keeps its own login, so logging out of one never logs out the others.
// agent.html and agent-deposit.html share the agent login (log in once, use both).
const PV_PANEL = /admin\.html/i.test(location.pathname) ? "admin" : /agent(-deposit)?\.html/i.test(location.pathname) ? "agent"
  : /marketing\.html/i.test(location.pathname) ? "marketing" : "customer";
const sb = window.supabase.createClient(CFG.SUPABASE_URL, CFG.SUPABASE_ANON_KEY, {
  auth: { persistSession: true, autoRefreshToken: true, detectSessionInUrl: true, storageKey: "premvio-" + PV_PANEL + "-login" },
});
const pvSignOut = () => sb.auth.signOut({ scope: "local" });

const $ = (s, r = document) => r.querySelector(s);
const $$ = (s, r = document) => [...r.querySelectorAll(s)];

function esc(s) {
  return String(s ?? "").replace(/[&<>"']/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
}
function money(n) {
  return CFG.CURRENCY + " " + Number(n || 0).toLocaleString("en-IN", { minimumFractionDigits: 2, maximumFractionDigits: 2 });
}
function fmtDate(d) {
  return new Date(d).toLocaleString("en-GB", { day: "2-digit", month: "short", year: "numeric", hour: "2-digit", minute: "2-digit" });
}
function timeLeft(to) {
  const ms = new Date(to) - Date.now();
  if (ms <= 0) return "expired";
  const h = Math.floor(ms / 3.6e6), m = Math.floor((ms % 3.6e6) / 6e4);
  return `${h}h ${m}m left`;
}
/* ---------- offline: a small bar on top; the screen stays where it is ---------- */
function isNetErr(e) { const m = e?.message || String(e || ""); return !navigator.onLine || /Failed to fetch|Load failed|NetworkError|network request failed/i.test(m); }
function pvNetBar(show) {
  let b = document.getElementById("netBar");
  if (show && !b) {
    b = document.createElement("div"); b.id = "netBar"; b.className = "net-bar"; b.setAttribute("role", "status");
    b.innerHTML = `<span class="nb-dot"></span><span>No internet connection</span>`;
    document.body.appendChild(b);
  } else if (!show && b) b.remove();
}
window.addEventListener("offline", () => pvNetBar(true));
window.addEventListener("online", () => {
  pvNetBar(false);
  if (document.querySelector(".offline-screen")) return location.reload();
  window.dispatchEvent(new Event("pv-online"));
});
if (!navigator.onLine) pvNetBar(true);
// last loaded data, so the app can still open and show something without internet
function pvCacheSet(k, v) { try { localStorage.setItem("pv_cache_" + PV_PANEL + "_" + k, JSON.stringify(v)); } catch (e) {} }
function pvCacheGet(k) { try { return JSON.parse(localStorage.getItem("pv_cache_" + PV_PANEL + "_" + k) || "null"); } catch (e) { return null; } }

function errMsg(e) {
  const m = e?.message || String(e);
  if (/Invalid login credentials/i.test(m)) return "Wrong email or password.";
  if (/Email not confirmed/i.test(m)) return "Please confirm your email first — check your inbox.";
  if (/already registered/i.test(m)) return "This email is already registered. Please log in.";
  if (/not authorized|sending confirmation|Error sending/i.test(m)) return "Sign-up email could not be sent. (Owner: in Supabase → Authentication → Sign In / Providers → Email, turn OFF \"Confirm email\".)";
  if (/email.*invalid|invalid.*email|validate email/i.test(m)) return "This email address was rejected. Use a real address like name@gmail.com. (Owner: in Supabase turn OFF \"Confirm email\" if this keeps happening.)";
  if (/rate limit|too many/i.test(m)) return "Too many attempts. Please wait a few minutes and try again.";
  if (/Database error/i.test(m)) return "Login database error — run 4-fix-admin-login.sql in Supabase. (" + m + ")";
  if (/Failed to fetch|Load failed|NetworkError|network request failed/i.test(m) || (typeof navigator !== "undefined" && navigator.onLine === false)) return "No internet connection";
  return m.replace(/^.*?ERROR:\s*/, "");
}

/* ---------- toast & modal ---------- */
function toast(msg, type = "") {
  let box = $("#toasts");
  if (!box) { box = document.createElement("div"); box.id = "toasts"; document.body.appendChild(box); }
  const t = document.createElement("div");
  t.className = "toast " + type;
  t.textContent = msg;
  box.appendChild(t);
  setTimeout(() => t.remove(), 3800);
}
function openModal(html, onMount) {
  closeModal();
  const bg = document.createElement("div");
  bg.className = "modal-bg";
  bg.id = "modal";
  bg.innerHTML = `<div class="modal"><button class="icon-btn close" data-close aria-label="Close">${ICONS.x}</button>${html}</div>`;
  bg.addEventListener("click", (e) => { if (e.target === bg || e.target.closest("[data-close]")) closeModal(); });
  document.body.appendChild(bg);
  document.body.style.overflow = "hidden";
  onMount && onMount(bg.querySelector(".modal"));
}
function closeModal() {
  $("#modal")?.remove();
  document.body.style.overflow = "";
}
function confirmBox(title, text, okLabel = "Confirm", danger = false) {
  return new Promise((resolve) => {
    openModal(`<h2>${esc(title)}</h2><p class="muted">${text}</p>
      <div class="row mt"><button class="btn ghost grow" data-close>Cancel</button>
      <button class="btn grow ${danger ? "danger" : ""}" id="cbOk">${esc(okLabel)}</button></div>`, (m) => {
      $("#cbOk", m).onclick = () => { closeModal(); resolve(true); };
      $$("[data-close]", m).forEach((b) => b.addEventListener("click", () => resolve(false)));
    });
  });
}
async function busy(btn, fn) {
  const old = btn.innerHTML;
  btn.disabled = true;
  btn.innerHTML = "Please wait…";
  try { return await fn(); }
  catch (e) { toast(errMsg(e), "error"); }
  finally { btn.disabled = false; btn.innerHTML = old; }
}

/* ---------- math captcha ---------- */
function mountCaptcha(container) {
  let a, b, op, ans;
  const draw = () => {
    a = 2 + Math.floor(Math.random() * 12);
    b = 1 + Math.floor(Math.random() * 9);
    op = Math.random() < .5 ? "+" : "×";
    if (op === "×") { b = 2 + Math.floor(Math.random() * 5); }
    ans = op === "+" ? a + b : a * b;
    $(".q", container).textContent = `${a} ${op} ${b} = ?`;
    $("input", container).value = "";
  };
  container.innerHTML = `<div class="captcha"><div class="q"></div>
    <input inputmode="numeric" placeholder="Answer" autocomplete="off" required>
    <button type="button" class="icon-btn" title="New question">${ICONS.refresh}</button></div>`;
  $("button", container).onclick = draw;
  draw();
  return { ok: () => Number($("input", container).value.trim()) === ans, reset: draw };
}

/* ---------- theme ---------- */
function applyTheme(t) {
  document.documentElement.setAttribute("data-theme", t === "light" ? "light" : "dark");
  try { localStorage.setItem("pv_theme", t); } catch (e) {}
  const meta = $('meta[name="theme-color"]');
  if (meta) meta.content = t === "light" ? "#f2f5fc" : "#060b1a";
}
try { applyTheme(localStorage.getItem("pv_theme") || "dark"); } catch (e) { applyTheme("dark"); }

/* ---------- service worker & push ---------- */
let swReg = null;
if ("serviceWorker" in navigator) {
  navigator.serviceWorker.register("sw.js").then((r) => (swReg = r)).catch(() => {});
}
function pushSupported() {
  return "serviceWorker" in navigator && "PushManager" in window && "Notification" in window;
}
function b64ToUint8(b64) {
  const pad = "=".repeat((4 - (b64.length % 4)) % 4);
  const raw = atob((b64 + pad).replace(/-/g, "+").replace(/_/g, "/"));
  return Uint8Array.from([...raw].map((c) => c.charCodeAt(0)));
}
async function enablePush(silent = false) {
  if (!pushSupported()) {
    if (!silent) toast(isIOS() ? "On iPhone: tap Share → Add to Home Screen, then open Premvio from your home screen to enable notifications." : "This browser doesn't support notifications.", "error");
    return false;
  }
  const perm = Notification.permission === "granted" ? "granted" : silent ? Notification.permission : await Notification.requestPermission();
  if (perm !== "granted") {
    if (!silent) toast("Notifications are blocked. Allow them in your browser settings.", "error");
    return false;
  }
  const reg = await navigator.serviceWorker.ready;
  let sub = await reg.pushManager.getSubscription();
  if (!sub) sub = await reg.pushManager.subscribe({ userVisibleOnly: true, applicationServerKey: b64ToUint8(CFG.VAPID_PUBLIC_KEY) });
  const j = sub.toJSON();
  const { error } = await sb.rpc("save_push_subscription", { p_endpoint: j.endpoint, p_p256dh: j.keys.p256dh, p_auth: j.keys.auth });
  if (error) { if (!silent) toast(errMsg(error), "error"); return false; }
  return true;
}
async function disablePush() {
  if (!pushSupported()) return;
  const reg = await navigator.serviceWorker.ready;
  const sub = await reg.pushManager.getSubscription();
  if (sub) {
    await sb.rpc("remove_push_subscription", { p_endpoint: sub.endpoint });
    await sub.unsubscribe();
  }
}
function isIOS() { return /iphone|ipad|ipod/i.test(navigator.userAgent); }
function isStandalone() { return matchMedia("(display-mode: standalone)").matches || navigator.standalone; }

/* ---------- auth for staff panels (admin / agent) ---------- */
// Agents and admins log in with their ID (AG1002 / AD1001). Internally that is <id>@staff.premvio.app
function staffEmail(v) {
  v = String(v || "").trim();
  return v.includes("@") ? v : v.toLowerCase() + "@staff.premvio.app";
}
async function getMyProfile() {
  const { data: { user } } = await sb.auth.getUser();
  if (!user) return null;
  const { data, error } = await sb.from("profiles").select("*").eq("id", user.id).single();
  if (error) throw error;
  return data;
}
function staffLogin(container, roleLabel, allowed, onOk) {
  container.innerHTML = `
  <div class="auth-wrap"><div class="auth-box">
    <img src="${PV_LOGO}" class="auth-logo" alt="Premvio">
    <div class="card">
      <h2 class="center">${esc(roleLabel)} login</h2>
      <form id="slForm">
        <label>${esc(roleLabel)} ID</label><input name="email" required autocomplete="off" autocapitalize="characters" spellcheck="false" style="text-transform:uppercase">
        <label>Password</label><input type="password" name="password" required autocomplete="off">
        <label>Security check</label><div id="slCap"></div>
        <button class="btn block mt">Log in</button>
      </form>
    </div>
  </div></div>`;
  const cap = mountCaptcha($("#slCap", container));
  $("#slForm", container).onsubmit = (e) => {
    e.preventDefault();
    const f = e.target;
    if (!cap.ok()) { toast("Wrong captcha answer.", "error"); cap.reset(); return; }
    busy($("button.btn", f), async () => {
      const { error } = await sb.auth.signInWithPassword({ email: staffEmail(f.email.value), password: f.password.value });
      if (error) { cap.reset(); if (/Invalid login/i.test(error.message)) throw new Error("Wrong ID or password."); throw error; }
      const p = await getMyProfile();
      if (!p || !allowed.includes(p.role) || p.blocked) {
        await pvSignOut();
        throw new Error(`This account does not have ${roleLabel.toLowerCase()} access.`);
      }
      onOk(p);
    });
  };
}

/* ---------- image upload (admin) ---------- */
// Pictures are made smaller before upload (faster app on mobile data). Logos keep their transparent background (webp).
async function uploadImage(file, folder) {
  let blob = file, ext = (file.name.split(".").pop() || "jpg").toLowerCase().replace(/[^a-z0-9]/g, "");
  const max = { products: 900, banners: 1600, methods: 400, features: 1200, delivery: 1400 }[folder] || 1200;
  if (/^image\/(jpe?g|png|webp|heic|heif)$/i.test(file.type || "")) {
    const keepAlpha = /png|webp/i.test(file.type);
    const out = await compressImage(file, max, 0.85, keepAlpha ? "image/webp" : "image/jpeg");
    if (out && out !== file && out.size && out.size < file.size) {
      blob = out; ext = { "image/jpeg": "jpg", "image/webp": "webp", "image/png": "png" }[out.type] || ext;
    }
  }
  const path = `${folder}/${Date.now()}-${Math.random().toString(36).slice(2, 10)}.${ext}`;
  const { error } = await sb.storage.from("media").upload(path, blob, { cacheControl: "31536000", upsert: false, contentType: blob.type || file.type || undefined });
  if (error) throw error;
  return sb.storage.from("media").getPublicUrl(path).data.publicUrl;
}

/* ---------- shrink a phone photo before upload (max 1600px JPEG) ---------- */
function compressImage(file, maxDim = 1600, quality = 0.85, type = "image/jpeg") {
  return new Promise((resolve) => {
    const url = URL.createObjectURL(file);
    const img = new Image();
    img.onload = () => {
      const scale = Math.min(1, maxDim / Math.max(img.width, img.height));
      const c = document.createElement("canvas");
      c.width = Math.round(img.width * scale); c.height = Math.round(img.height * scale);
      c.getContext("2d").drawImage(img, 0, 0, c.width, c.height);
      URL.revokeObjectURL(url);
      c.toBlob((b) => resolve(b || file), type, quality);
    };
    img.onerror = () => { URL.revokeObjectURL(url); resolve(file); };
    setTimeout(() => resolve(file), 8000); // safety: never hang on unusual formats
    img.src = url;
  });
}

/* ---------- searchable pick list: type "p" → every option starting with p ---------- */
// input: <input>, getOptions(): string[], onPick(value): optional
function mountPicker(input, getOptions, onPick) {
  const wrap = document.createElement("div");
  wrap.className = "ac";
  input.parentNode.insertBefore(wrap, input);
  wrap.appendChild(input);
  input.setAttribute("autocomplete", "off");
  const list = document.createElement("div");
  list.className = "ac-list hidden";
  wrap.appendChild(list);
  let active = -1, shown = [];
  const close = () => { list.classList.add("hidden"); active = -1; };
  const draw = () => {
    const q = input.value.trim().toLowerCase();
    const all = getOptions();
    shown = all.filter((o) => o.toLowerCase().startsWith(q));
    if (!all.length) { close(); return; }
    list.innerHTML = shown.length
      ? shown.map((o, i) => `<button type="button" class="ac-item ${i === active ? "on" : ""}" data-i="${i}"><b>${esc(o.slice(0, q.length))}</b>${esc(o.slice(q.length))}</button>`).join("")
      : `<div class="ac-empty">No match for “${esc(input.value.trim())}”</div>`;
    list.classList.remove("hidden");
  };
  const pick = (v) => { input.value = v; close(); onPick && onPick(v); };
  input.addEventListener("focus", () => { active = -1; draw(); });
  input.addEventListener("input", () => { active = -1; draw(); onPick && onPick(null); });
  input.addEventListener("keydown", (e) => {
    if (list.classList.contains("hidden")) return;
    if (e.key === "ArrowDown") { active = Math.min(active + 1, shown.length - 1); draw(); e.preventDefault(); }
    else if (e.key === "ArrowUp") { active = Math.max(active - 1, 0); draw(); e.preventDefault(); }
    else if (e.key === "Enter" && active >= 0) { pick(shown[active]); e.preventDefault(); }
    else if (e.key === "Escape") close();
  });
  list.addEventListener("mousedown", (e) => e.preventDefault()); // keep focus while choosing
  list.addEventListener("click", (e) => { const b = e.target.closest(".ac-item"); if (b) pick(shown[Number(b.dataset.i)]); });
  input.addEventListener("blur", () => setTimeout(close, 120));
  return { refresh: draw };
}

/* ---------- date range (calendar) for history pages ---------- */
function ymd(d) { const z = new Date(d.getTime() - d.getTimezoneOffset() * 6e4); return z.toISOString().slice(0, 10); }
function defaultRange(days = 30) { const to = new Date(); return { from: ymd(new Date(to.getTime() - (days - 1) * 864e5)), to: ymd(to) }; }
function rangeISO(r) {
  const a = new Date(r.from + "T00:00:00"), b = new Date(new Date(r.to + "T00:00:00").getTime() + 864e5);
  return [a.toISOString(), b.toISOString()];
}
function rangeBar(r) {
  return `<div class="toolbar range-bar">
    <label class="row small" style="margin:0;gap:6px">From <input type="date" data-r="from" value="${r.from}" max="${r.to}" style="width:auto"></label>
    <label class="row small" style="margin:0;gap:6px">To <input type="date" data-r="to" value="${r.to}" min="${r.from}" max="${ymd(new Date())}" style="width:auto"></label>
    <button type="button" class="btn sm soft" data-preset="1">Today</button>
    <button type="button" class="btn sm soft" data-preset="7">7 days</button>
    <button type="button" class="btn sm soft" data-preset="30">30 days</button>
    <button type="button" class="btn sm soft" data-preset="90">90 days</button>
  </div>`;
}
// wire a rangeBar inside `root`: calls onChange(newRange) when dates change
function bindRange(root, r, onChange) {
  $$("[data-r]", root).forEach((inp) => (inp.onchange = () => {
    const nr = { ...r, [inp.dataset.r]: inp.value };
    if (!nr.from || !nr.to) return;
    if (nr.from > nr.to) return toast("'From' must be before 'To'.", "error");
    onChange(nr);
  }));
  $$("[data-preset]", root).forEach((b) => (b.onclick = () => onChange(defaultRange(Number(b.dataset.preset)))));
}
function fmtDay(s) { return new Date(s + "T00:00:00").toLocaleDateString("en-GB", { day: "2-digit", month: "short", year: "numeric" }); }

/* ---- details that appear when an option is chosen (fd.info = {option: text}) ---- */
function optInfoBox(f) {
  const info = f && f.info && typeof f.info === "object" ? f.info : null;
  if (!info || !Object.keys(info).length) return "";
  return `<div class="opt-info" data-oi="${esc(f.id)}" data-info="${esc(JSON.stringify(info))}"></div>`;
}
function optInfoPaint(box) {
  const form = box.closest("form"); if (!form) return;
  let info = {}; try { info = JSON.parse(box.dataset.info || "{}"); } catch (e) {}
  const els = [...form.querySelectorAll(`[name="f_${box.dataset.oi}"]`)];
  const picked = els.filter((el) => (el.type === "radio" || el.type === "checkbox" ? el.checked : true)).map((el) => el.value).filter(Boolean);
  box.innerHTML = picked.filter((v) => info[v]).map((v) => `<div class="info-field"><div class="if-row"><span class="if-val">${esc(info[v])}</span>
    <button type="button" class="btn sm soft" onclick="copyText(this.dataset.v)" data-v="${esc(info[v])}">${ICONS.copy} Copy</button></div></div>`).join("");
}
document.addEventListener("change", (e) => {
  const n = e.target && e.target.name;
  if (!n || !n.startsWith("f_")) return;
  const form = e.target.closest("form"); if (!form) return;
  form.querySelectorAll(`.opt-info[data-oi="${CSS.escape(n.slice(2))}"]`).forEach(optInfoPaint);
});
// boxes added with a value already chosen (editing a cart item, Buy again) show their details straight away
new MutationObserver((list) => {
  for (const m of list) for (const node of m.addedNodes) {
    if (node.nodeType !== 1) continue;
    (node.matches?.(".opt-info") ? [node] : [...node.querySelectorAll?.(".opt-info") || []]).forEach((b) => setTimeout(() => optInfoPaint(b), 0));
  }
}).observe(document.documentElement, { childList: true, subtree: true });

// Method button link: "@premvio", "premvio", "t.me/premvio" or a full https link → a link that opens.
// Telegram usernames open the Telegram app (https://t.me/…). Returns "" if it can't be used.
function pvLink(v) {
  v = String(v || "").trim();
  if (!v) return "";
  if (/^@?[A-Za-z][A-Za-z0-9_]{3,31}$/.test(v)) return "https://t.me/" + v.replace(/^@/, "");
  if (/^tg:\/\//i.test(v)) return v;
  if (/^(t|telegram)\.me\//i.test(v)) return "https://" + v;
  if (!/^https?:\/\//i.test(v) && /^[\w-]+(\.[\w-]+)+(\/.*)?$/.test(v)) return "https://" + v;
  return /^https?:\/\//i.test(v) ? v : "";
}
function pvLinkBtn(m, cls = "btn sm deposit") {
  const href = pvLink(m.link);
  if (!href) return "";
  const tg = /^(https:\/\/(t|telegram)\.me\/|tg:)/i.test(href);

const PV_NE_RX = [
  [/^Hi, (.+)$/, "नमस्ते, $1"],
  [/^Pay (NPR [\d,.]+) for all$/, "सबैको $1 तिर्नुहोस्"],
  [/^Only (\d+) left today$/, "आज $1 मात्र बाँकी"],
  [/^Price: (NPR [\d,.]+) each/, "मूल्य: प्रति $1"],
  [/^Order #(\d+) placed$/, "अर्डर #$1 भयो"],
  [/^Gift #(\d+) placed$/, "उपहार #$1 पठाइयो"],
  [/^You'll earn ⭐ ([\d.]+) points when your orders are delivered\.$/, "अर्डर पुगेपछि तपाईंले ⭐ $1 पोइन्ट पाउनुहुनेछ।"],
  [/^The amount will be deducted from your balance\.( You'll earn ⭐ ([\d.]+) points\.)?$/, (m, a, n) => "रकम तपाईंको ब्यालेन्सबाट काटिनेछ।" + (n ? ` तपाईंले ⭐ ${n} पोइन्ट पाउनुहुनेछ।` : "")],
  [/^Added to cart \((\d+) items?\)\.$/, "कार्टमा थपियो ($1)।"],
  [/^Quantity \((\d+)–(\d+)\)$/, "संख्या ($1–$2)"],
];
function pvTr(t) {
  const k = t.trim();
  if (!k || !/[A-Za-z]/.test(k)) return null;
  let n = PV_NE[k];
  if (n == null) for (const [rx, rep] of PV_NE_RX) { if (rx.test(k)) { n = k.replace(rx, rep); break; } }
  if (n == null || n === k) return null;   // same text → leave it (prevents an endless loop)
  const out = t.replace(k, n);
  return out === t ? null : out;
}
function pvTranslate(root) {
  if (!root) return;
  if (root.nodeType === 3) { const n = pvTr(root.nodeValue); if (n != null) root.nodeValue = n; return; }
  if (root.nodeType !== 1 || /^(SCRIPT|STYLE|TEXTAREA)$/.test(root.tagName) || root.closest?.("[data-notr]")) return;
  for (const a of ["placeholder", "title", "aria-label"]) { const v = root.getAttribute?.(a); if (v) { const n = pvTr(v); if (n != null) root.setAttribute(a, n); } }
  const w = document.createTreeWalker(root, NodeFilter.SHOW_TEXT | NodeFilter.SHOW_ELEMENT);
  let node;
  while ((node = w.nextNode())) {
    if (node.nodeType === 3) { if (!node.parentElement?.closest("textarea,script,style,[data-notr]")) { const n = pvTr(node.nodeValue); if (n != null) node.nodeValue = n; } }
    else for (const a of ["placeholder", "title", "aria-label"]) { const v = node.getAttribute(a); if (v) { const n = pvTr(v); if (n != null) node.setAttribute(a, n); } }
  }
}
function pvLang() { try { return localStorage.getItem("pv_lang") === "ne" ? "ne" : "en"; } catch (e) { return "en"; } }
function pvSetLang(l) { try { localStorage.setItem("pv_lang", l); } catch (e) {} location.reload(); }
if (pvLang() === "ne") {
  document.documentElement.lang = "ne";
  const start = () => {
    pvTranslate(document.body);
    new MutationObserver((ms) => ms.forEach((m) => {
      if (m.type === "characterData") pvTranslate(m.target);
      else m.addedNodes.forEach(pvTranslate);
    })).observe(document.body, { childList: true, subtree: true, characterData: true });
  };
  if (document.body) start(); else document.addEventListener("DOMContentLoaded", start);
}

<script>
/* ============ PREMVIO — Customer panel ============ */
const S = { user: null, profile: null, settings: {}, products: [], features: [], channel: null, unread: 0, histTab: "all", timer: null };
const root = $("#root");
let installEvt = null;
window.addEventListener("beforeinstallprompt", (e) => { e.preventDefault(); installEvt = e; });

/* ---------------- start ---------------- */
// Invite link: premvio.app/?ref=PV123456 → remembered until the new customer registers
try { const r = new URLSearchParams(location.search).get("ref"); if (r && /^PV\d{6}$/i.test(r)) localStorage.setItem("pv_ref", r.toUpperCase()); } catch (e) {}
sb.auth.onAuthStateChange((event, session) => {
  if (event === "PASSWORD_RECOVERY") { setTimeout(newPasswordModal, 300); return; }
  if (event === "SIGNED_OUT") {
    const was = S.user; S.user = null; stopLive();
    if (was || !$(".auth-wrap")) renderAuth();   // already on the login/register screen → don't redraw it (keeps Register + the human check)
    return;
  }
  if (session?.user && (!S.user || S.user.id !== session.user.id)) {
    S.user = session.user;
    setTimeout(startApp, 0);
  }
});
sb.auth.getSession().then(({ data }) => { if (!data.session && !$(".auth-wrap")) renderAuth(); });

/* ---------------- Cloudflare Turnstile ("I am human" check) on Register ---------------- */
function mountTurnstile(box) {
  let tok = null, tries = 0;
  const key = CFG.TURNSTILE_SITE_KEY;
  if (!key) return { token: () => "off", reset() {} };
  const T = () => window.turnstile;
  const fail = (msg) => {
    if (!document.body.contains(box)) return;
    box.innerHTML = `<div class="ts-fail"><span>${esc(msg)}</span><button type="button" class="btn sm soft" id="tsRetry">Try again</button></div>`;
    $("#tsRetry", box).onclick = () => { tries = 0; draw(); };
  };
  const draw = () => {
    if (!document.body.contains(box)) return;
    if (!T()) {
      if (++tries > 60) return fail("Security check did not load. Check your internet.");
      return setTimeout(draw, 250);
    }
    try { if (S.tsWid != null) T().remove(S.tsWid); } catch (e) {}
    S.tsWid = null; tok = null;
    box.innerHTML = "";
    const holder = document.createElement("div");
    box.appendChild(holder);
    try {
      S.tsWid = T().render(holder, {
        sitekey: key, size: "flexible", appearance: "always", retry: "auto", "refresh-expired": "auto",
        theme: document.documentElement.dataset.theme === "light" ? "light" : "dark",
        callback: (t) => { tok = t; },
        "expired-callback": () => { tok = null; },
        "error-callback": (code) => { tok = null; fail("Security check error" + (code ? " (" + code + ")" : "") + "."); return true; },
      });
    } catch (e) { fail("Security check error."); }
  };
  draw();
  return { token: () => tok, reset() { tok = null; try { if (S.tsWid != null) T().reset(S.tsWid); else draw(); } catch (e) { draw(); } } };
}

// opened with saved data: keep checking quietly until the database answers again
function netWatch() {
  clearInterval(S.netTimer);
  S.netTimer = setInterval(async () => {
    if (!navigator.onLine) return;
    try { await loadProfile(true); clearInterval(S.netTimer); pvNetBar(false); window.dispatchEvent(new Event("pv-online")); } catch (e) {}
  }, 10000);
}
// internet is back: refresh what is on screen
window.addEventListener("pv-online", async () => {
  if (!S.user || !$(".app")) return;
  try { await Promise.all([loadProfile(), loadSettings()]); $$("[data-balance]").forEach((el) => (el.textContent = money(S.profile.balance))); } catch (e) {}
  if (!document.querySelector("#modal .modal")) route();
});

/* ---------------- auth screens ---------------- */
function renderAuth(mode) {
  if (!mode) { try { mode = sessionStorage.getItem("pv_auth_mode") || "login"; } catch (e) { mode = "login"; } }
  try { sessionStorage.setItem("pv_auth_mode", mode); } catch (e) {}
  root.innerHTML = `
  <div class="auth-wrap"><div class="auth-box">
    <img src="${PV_LOGO}" class="auth-logo" alt="Premvio">
    <p class="center muted mb">Telegram Stars &amp; Premium</p>
    <div class="card">
      <div class="tabs"><button data-m="login" class="${mode === "login" ? "on" : ""}">Log in</button>
        <button data-m="register" class="${mode === "register" ? "on" : ""}">Register</button></div>
      <div id="authBody"></div>
    </div>
  </div></div>`;
  $$(".tabs button", root).forEach((b) => (b.onclick = () => renderAuth(b.dataset.m)));
  if (!$(".auth-lang")) { const lb = document.createElement("button"); lb.className = "auth-lang"; lb.setAttribute("data-notr", ""); lb.textContent = pvLang() === "ne" ? "English" : "नेपाली"; lb.onclick = () => pvSetLang(pvLang() === "ne" ? "en" : "ne"); root.querySelector(".auth-wrap")?.appendChild(lb); }
  const body = $("#authBody");

  if (mode === "login") {
    body.innerHTML = `<form id="f">
      <label>Email (Gmail)</label><input type="email" name="email" required autocomplete="email" placeholder="you@gmail.com">
      <label>Password</label><input type="password" name="password" required autocomplete="current-password">
      <label>Security check</label><div id="cap"></div>
      <button class="btn block mt">Log in</button>
      <p class="center mt small"><button type="button" class="link-btn" id="forgot">Forgot password?</button></p>
    </form>`;
    const cap = mountCaptcha($("#cap"));
    $("#forgot").onclick = () => renderAuth("forgot");
    $("#f").onsubmit = (e) => {
      e.preventDefault();
      const f = e.target;
      if (!cap.ok()) { toast("Wrong captcha answer, try again.", "error"); cap.reset(); return; }
      busy($("button.btn", f), async () => {
        markUnlocked();   // typing the password counts as unlocking the PIN
        const { error } = await sb.auth.signInWithPassword({ email: f.email.value.trim(), password: f.password.value });
        if (error) { cap.reset(); throw error; }
      });
    };
  } else if (mode === "register") {
    body.innerHTML = `<form id="f">
      <label>Full name</label><input name="full_name" required autocomplete="name" maxlength="80">
      <label>Email (Gmail)</label><input type="email" name="email" required autocomplete="email" placeholder="you@gmail.com">
      <label>Phone number</label><input type="tel" name="phone" required autocomplete="tel" placeholder="98XXXXXXXX" maxlength="20">
      <label>Country</label><select name="country" required>${countryOptions("Nepal")}</select>
      <label>Password</label><input type="password" name="password" required minlength="6" autocomplete="new-password" placeholder="At least 6 characters">
      <label>Confirm password</label><input type="password" name="password2" required minlength="6" autocomplete="new-password">
      <label>Invite code <span class="muted">(optional — a friend's Member ID)</span></label>
      <input name="ref" maxlength="8" placeholder="PV123456" autocapitalize="characters" style="text-transform:uppercase" value="${esc((() => { try { return localStorage.getItem("pv_ref") || ""; } catch (e) { return ""; } })())}">
      <div id="tsBox" class="ts-box"></div>
      <button class="btn block mt">Create account</button>
    </form>`;
    const ts = mountTurnstile($("#tsBox"));
    $("#f").onsubmit = (e) => {
      e.preventDefault();
      const f = e.target;
      if (f.password.value !== f.password2.value) { toast("Passwords don't match.", "error"); return; }
      if (!/^[+0-9 ()-]{7,20}$/.test(f.phone.value.trim())) { toast("Enter a valid phone number.", "error"); return; }
      if (!ts.token()) { toast("Please complete the “I am human” check.", "error"); return; }
      const ref = f.ref.value.trim().toUpperCase();
      if (ref && !/^PV\d{6}$/.test(ref)) { toast("Invite code looks like PV123456.", "error"); return; }
      try { if (ref) localStorage.setItem("pv_ref", ref); else localStorage.removeItem("pv_ref"); } catch (e) {}
      busy($("button.btn", f), async () => {
        const email = f.email.value.trim(), password = f.password.value;
        const { error } = await sb.rpc("register_customer", { p_email: email, p_password: password,
          p_full_name: f.full_name.value.trim(), p_phone: f.phone.value.trim(), p_country: f.country.value, p_captcha: ts.token() });
        if (error) { ts.reset(); throw error; }
        markUnlocked();
        const { error: e2 } = await sb.auth.signInWithPassword({ email, password });
        if (e2) { toast("Account created. Please log in.", "success"); renderAuth("login"); return; }
        toast("Welcome to Premvio!", "success");
      });
    };
  } else {
    body.innerHTML = `<form id="f"><h3>Reset password</h3>
      <p class="muted small">Enter your email and we'll send a reset link.</p>
      <label>Email</label><input type="email" name="email" required>
      <label>Security check</label><div id="cap"></div>
      <button class="btn block mt">Send reset link</button>
      <p class="center mt small"><button type="button" class="link-btn" id="back">Back to login</button></p></form>`;
    const cap = mountCaptcha($("#cap"));
    $("#back").onclick = () => renderAuth("login");

/* ---------------- 🔒 APP PIN LOCK ---------------- */
function markUnlocked() { try { sessionStorage.setItem("pv_unlocked", String(Date.now())); } catch (e) {} }
function isUnlocked() { try { return !!sessionStorage.getItem("pv_unlocked"); } catch (e) { return false; } }
// full-screen keypad; resolves when the right PIN is typed
function pinLockScreen() {
  return new Promise((resolve) => {
    const holder = document.createElement("div");
    holder.className = "pin-screen";
    document.body.appendChild(holder);
    pinPad(holder, { title: `Hi ${esc((S.profile.full_name || "").split(" ")[0])} 👋`, sub: "Enter your PIN to open Premvio", forgot: true }, () => {
      markUnlocked(); holder.remove(); resolve(true);
    });
  });
}
// asks for the PIN before paying (only if the customer turned the PIN on)
function requirePin(reason) {
  if (!S.profile.has_pin) return Promise.resolve(true);
  return pinOverlay("🔒 Enter your PIN", reason || "Confirm with your PIN");
}
// PIN keypad on top of everything (keeps the open form underneath)
function pinOverlay(title, sub) {
  return new Promise((resolve) => {
    const ov = document.createElement("div");
    ov.className = "pin-overlay";
    ov.innerHTML = `<div class="pin-card"><button type="button" class="icon-btn close" aria-label="Cancel">${ICONS.x}</button><div class="pin-host"></div></div>`;
    document.body.appendChild(ov);
    const done = (ok) => { ov.remove(); resolve(ok); };
    $(".close", ov).onclick = () => done(false);
    ov.onclick = (e) => { if (e.target === ov) done(false); };
    pinPad($(".pin-host", ov), { title, sub }, () => done(true));
  });
}
function pinPad(box, o, onOk) {
  let v = "";
  box.innerHTML = `<div class="pin-pad">
    ${o.forgot ? `<img src="${PV_LOGO}" class="pin-logo" alt="">` : ""}
    <h2>${o.title}</h2><p class="muted small">${esc(o.sub)}</p>
    <div class="pin-dots">${"<i></i>".repeat(4)}</div><p class="pin-msg small"></p>
    <div class="pin-keys">${[1, 2, 3, 4, 5, 6, 7, 8, 9].map((n) => `<button type="button" data-k="${n}">${n}</button>`).join("")}
      <span></span><button type="button" data-k="0">0</button><button type="button" data-k="del" aria-label="Delete">⌫</button></div>
    ${o.forgot ? `<button type="button" class="link-btn small mt" id="pinForgot">Forgot PIN? Log in with your password</button>` : ""}</div>`;
  const dots = $$(".pin-dots i", box), msg = $(".pin-msg", box);
  const paint = () => dots.forEach((d, i) => d.classList.toggle("on", i < v.length));
  const check = async () => {
    box.classList.add("busy");
    const { data, error } = await sb.rpc("verify_pin", { p_pin: v });
    box.classList.remove("busy");
    if (data === true) { S._padPin = v; return onOk(); }
    v = ""; paint();
    msg.textContent = error ? errMsg(error) : "Wrong PIN. Try again.";
    $(".pin-dots", box).classList.remove("shake"); void box.offsetWidth; $(".pin-dots", box).classList.add("shake");
  };
  $$("[data-k]", box).forEach((b) => (b.onclick = () => {
    if (box.classList.contains("busy")) return;
    if (b.dataset.k === "del") v = v.slice(0, -1); else if (v.length < 4) v += b.dataset.k;
    msg.textContent = ""; paint();
    if (v.length === 4) check();
  }));
  if ($("#pinForgot", box)) $("#pinForgot", box).onclick = async () => { await pvSignOut(); location.reload(); };
  paint();
}
