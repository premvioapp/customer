// ⭐ points: 1 point = NPR 1, up to points_max_percent of the amount to pay
function pointsToggle() {
  const have = Number(S.profile.points || 0);
  if (!(have > 0)) return "";
  return `<label class="pts-toggle"><input type="checkbox" name="usePts"><span>⭐ Use my points <b>${have.toLocaleString("en-IN")}</b> available
    <small class="muted">(pay up to ${Number(S.settings.points_max_percent || 50)}% with points)</small></span></label>`;
}
function pointsFor(f, toPay) {
  if (!f.usePts?.checked) return 0;
  const maxPct = Number(S.settings.points_max_percent || 50);
  return Math.max(0, Math.min(Number(S.profile.points || 0), Math.round(toPay * maxPct) / 100));
}
function cashbackFor(paid) {
  if (S.settings.cashback_on !== "true") return 0;
  return Math.round(paid * Number(S.settings.cashback_percent || 0)) / 100;
}
async function checkPromo(code, items) {
  const { data, error } = await sb.rpc("check_promo", { p_code: code, p_items: items });
  if (error) throw error;
  return data;
}

function buyModal(p) {
  const fields = p.fields || [];
  const free = !!p.is_free;
  openModal(`<h2>${free ? "🎁 Get" : "Buy"} ${esc(p.name)}</h2>
    <p class="muted small">${free ? `<b style="color:var(--green)">FREE</b>${p.free_per_user ? ` · limit ${p.free_per_user} per customer` : ""}`
      : `Price: <span id="each">${money(unitPrice(p, {}))}</span> each${saleOn(p) ? ` <span class="sale-pct">sale</span>` : ""} · Your balance: <b data-balance>${money(S.profile.balance)}</b>`}</p>
    <form id="bf">
      <label>Quantity <span class="muted">(${p.min_qty}–${p.max_qty})</span></label>
      <input type="number" name="qty" min="${p.min_qty}" max="${p.max_qty}" step="1" value="${p.min_qty}" required inputmode="numeric">
      ${fields.map((fd) => fieldInput(fd, undefined, p)).join("")}
      ${giftBlock(null)}
      ${free ? "" : `<label>Promo code <span class="muted">(optional)</span></label>${promoBox("")}
      ${pointsToggle()}`}
      <div class="card mt" style="box-shadow:none">
        <div class="row between hidden" id="discRow"><span class="muted">Promo discount</span><b style="color:var(--green)" id="disc"></b></div>
        <div class="row between hidden" id="ptsRow"><span class="muted">Points used</span><b style="color:var(--green)" id="ptsUsed"></b></div>
        <div class="row between"><span class="muted">Total</span><b id="tot" style="font-size:1.2rem;color:var(--gold)"></b></div></div>
      <p class="small muted mt" id="warn"></p>
      <button class="btn block gold mt">${free ? "🎁 Get it free" : "Confirm purchase"}</button>
    </form>`, (m) => {
    const f = $("#bf", m);
    let promo = null;   // {code, discount} after the server says the code works
    const calc = () => {
      const unit = unitPrice(p, formValues(f, fields));
      if ($("#each", m)) $("#each", m).textContent = money(unit);
      const gross = Math.max(0, Math.floor(Number(f.qty.value) || 0)) * unit;
      const d = promo ? Math.min(promo.discount, gross) : 0;
      const pts = pointsFor(f, gross - d), t = gross - d - pts;
      $("#discRow", m).classList.toggle("hidden", !d);
      $("#disc", m).textContent = "−" + money(d);
      $("#ptsRow", m).classList.toggle("hidden", !pts);
      $("#ptsUsed", m).textContent = "−" + money(pts);
      $("#tot", m).textContent = money(t);
      const earn = cashbackFor(t);
      $("#warn", m).dataset.earn = earn ? ` You'll earn ⭐ ${earn} points.` : "";
      const low = t > Number(S.profile.balance);
      $("#warn", m).innerHTML = free ? "It's free — nothing is taken from your balance."
        : low ? `⚠️ Not enough balance. <a href="#deposit" data-close>Deposit money</a>` : "The amount will be deducted from your balance." + ($("#warn", m).dataset.earn || "");
      return t;
    };
    if (f.usePts) f.usePts.onchange = calc;
    const pBtn = $("[data-promo]", m), pMsg = $(".promo-msg", m);
    const applyPromo = async (silent) => {
      if (!f.promo) return;
      const code = f.promo.value.trim().toUpperCase();
      if (!code) return;
      try {
        const r = await checkPromo(code, [{ product: p.id, quantity: Math.floor(Number(f.qty.value) || 0), form: formValues(f, fields) }]);
        promo = { code: r.code, discount: Number(r.discount) };
        f.promo.value = r.code; f.promo.readOnly = true; pBtn.textContent = "Remove";
        pMsg.innerHTML = `<span style="color:var(--green)">✅ ${esc(r.code)} applied — you save ${money(r.discount)}</span>`;
      } catch (e) {
        promo = null; f.promo.readOnly = false; pBtn.textContent = "Apply";
        pMsg.innerHTML = `<span style="color:var(--red)">${esc(errMsg(e))}</span>`;
        if (!silent) f.promo.focus();
      }
      calc();
    };
    if (pBtn) {
      pBtn.onclick = () => {
        if (promo) { promo = null; f.promo.value = ""; f.promo.readOnly = false; pBtn.textContent = "Apply"; pMsg.innerHTML = ""; calc(); return; }
        pBtn.disabled = true; pBtn.textContent = "…"; applyPromo(false).finally(() => (pBtn.disabled = false));
      };
      f.promo.onkeydown = (e) => { if (e.key === "Enter") { e.preventDefault(); pBtn.click(); } };
    }
    bindGift(f, fields, m);
    let qt;
    const changed = (e) => {
      if (e && e.target && /^(promo|g_|isGift|usePts)/.test(e.target.name || "")) return;
      calc(); if (promo) { clearTimeout(qt); qt = setTimeout(() => applyPromo(true), 400); }
    };
    f.addEventListener("input", changed); f.addEventListener("change", changed);   // quantity + options → live price
    calc();
    f.onsubmit = (e) => {
      e.preventDefault();
      const qty = Math.floor(Number(f.qty.value));
      if (qty < p.min_qty || qty > p.max_qty) { toast(`Quantity must be ${p.min_qty}–${p.max_qty}.`, "error"); return; }
      const form = readForm(f, fields);
      if (!form) return;
      const gift = readGift(f);
      if (gift === false) return;
      if (calc() > Number(S.profile.balance)) { toast("Not enough balance.", "error"); return; }
      busy($('button.btn:not([type="button"])', f), async () => {
        if (calc() > 0 && !(await requirePin(`Pay ${money(calc())}`))) return;
        const args = { p_product: p.id, p_quantity: qty, p_form: form };
        if (promo) args.p_promo = promo.code;
        if (gift) args.p_gift = gift;
        if (f.usePts?.checked) args.p_points = true;
        const { data, error } = await sb.rpc("place_order", args);
        if (error) throw error;
        if (!gift) rememberFields(fields, form);
        await loadProfile();
        openModal(`<div class="empty"><div class="big">${gift ? "🎁" : "✅"}</div><h2>${gift ? "Gift" : "Order"} #${data} placed</h2>
          <p>${gift ? `We'll deliver <b>${esc(p.name)}</b> to <b>${esc(gift.to_name)}</b> soon.${gift.to_member ? " They'll get a notification." : ""}` : `We'll deliver <b>${esc(p.name)}</b> soon.`} You'll get a notification when it's done.</p>
          ${promo ? `<p class="small" style="color:var(--green)">You saved ${money(promo.discount)} with ${esc(promo.code)}.</p>` : ""}
          <button class="btn block mt" data-close>OK</button></div>`);
        $$("[data-balance]").forEach((el) => (el.textContent = money(S.profile.balance)));
      });
    };
  });
}

const REMEMBER_TYPES = ["text", "number", "phone", "email"];
// what is in the form right now (no checks) — used for the live price
function formValues(f, fields) {
  const form = {};
  for (const fd of fields) {
    if (fd.type === "multi") { form[fd.id] = $$(`input[name="f_${fd.id}"]:checked`, f).map((x) => x.value); continue; }
    if (fd.type === "choice") { form[fd.id] = $(`input[name="f_${fd.id}"]:checked`, f)?.value || ""; continue; }
    let v = (f.elements["f_" + fd.id]?.value || "").trim();
    if ((fd.type || "text") === "text" && /telegram/i.test(fd.label) && v && !v.startsWith("@") && !/^\+?\d/.test(v)) v = "@" + v;
    form[fd.id] = v;
  }
  return form;
}
// same + checks the browser can't do (tick boxes). Returns null if something is missing.
function readForm(f, fields) {
  const form = formValues(f, fields);
  for (const fd of fields) {
    if (fd.type === "multi" && fd.required && !(form[fd.id] || []).length) {
      toast(`Please choose: ${fd.label}`, "error");
      $(`[data-multi="${fd.id}"]`, f)?.scrollIntoView({ block: "center", behavior: "smooth" });
      return null;
    }
  }
  return form;
}
function rememberFields(fields, form) {
  try { fields.forEach((fd) => { if (form[fd.id] && REMEMBER_TYPES.includes(fd.type || "text")) localStorage.setItem("pv_field_" + fd.label.toLowerCase(), form[fd.id]); }); } catch (e) {}
}
function formText(p, form) {
  return (p.fields || []).map((fd) => { const v = form?.[fd.id]; return Array.isArray(v) ? v.join(", ") : v; }).filter(Boolean).join(" · ");
}

/* ---------------- tap vs long-press ---------------- */
function bindPress(el, onTap, onLong, ms = 450) {
  let timer = null, long = false, sx = 0, sy = 0;
  const cancel = () => { clearTimeout(timer); el.classList.remove("pressing"); };
  el.addEventListener("pointerdown", (e) => {
    long = false; sx = e.clientX || 0; sy = e.clientY || 0;
    el.classList.add("pressing");
    timer = setTimeout(() => { long = true; el.classList.remove("pressing"); try { navigator.vibrate?.(25); } catch (x) {} onLong(); }, ms);
  });
  ["pointerup", "pointerleave", "pointercancel"].forEach((ev) => el.addEventListener(ev, cancel));
  el.addEventListener("pointermove", (e) => { if (Math.hypot((e.clientX || 0) - sx, (e.clientY || 0) - sy) > 12) cancel(); });
  el.addEventListener("contextmenu", (e) => e.preventDefault());
  el.addEventListener("click", (e) => { if (long) { e.preventDefault(); long = false; return; } onTap(); });
}

/* ---------------- CART (saved on this phone) ---------------- */
function cartKey() { return "pv_cart_" + (S.user?.id || ""); }
function getCart() {
  try { return JSON.parse(localStorage.getItem(cartKey()) || "[]"); } catch (e) { return S._cart || []; }
}
function setCart(items) {
  S._cart = items;
  try { localStorage.setItem(cartKey(), JSON.stringify(items)); } catch (e) {}
  updateCartBadge();
  // keep a copy on the server so we can remind the customer about a forgotten cart
  clearTimeout(S.cartSync);
  S.cartSync = setTimeout(() => {
    if (!S.user) return;
    sb.from("carts").upsert({ user_id: S.user.id, items: items.map((it) => ({ product: it.product, quantity: it.quantity })), updated_at: new Date().toISOString(), reminded_at: null })
      .then(() => {}, () => {});
  }, 1500);
}
function updateCartBadge() {
  const b = $("#cartBadge");
  if (!b) return;
  const n = getCart().reduce((a, it) => a + 1, 0);
  b.textContent = n > 9 ? "9+" : n;
  b.classList.toggle("hidden", !n);
}
// Add a product to the cart (or edit an existing cart item)
function cartModal(p, item) {
  if (!p) return toast("This product is no longer available.", "error");
  if (!item && soldOut(p)) return toast(`${p.name} is ${p.out_of_stock ? "out of stock" : "sold out for today"}.`, "error");
  const fields = p.fields || [];
  const qty0 = item ? item.quantity : p.min_qty;
  openModal(`<h2>${item ? "Edit" : "Add to cart"}: ${esc(p.name)}</h2>
    <p class="muted small">${p.is_free ? `<b style="color:var(--green)">FREE</b>${p.free_per_user ? ` · limit ${p.free_per_user} per customer` : ""}`
      : `Price: <span id="each">${money(unitPrice(p, item?.form || {}))}</span> each${saleOn(p) ? ` <span class="sale-pct">sale</span>` : ""}`}</p>
    <form id="cf">
      <label>Quantity <span class="muted">(${p.min_qty}–${p.max_qty})</span></label>
      <div class="qty-row"><button type="button" class="qbtn" data-q="-1">−</button>
        <input type="number" name="qty" min="${p.min_qty}" max="${p.max_qty}" step="1" value="${qty0}" required inputmode="numeric">
        <button type="button" class="qbtn" data-q="1">+</button></div>
      ${fields.map((fd) => fieldInput(fd, item ? item.form?.[fd.id] : undefined, p)).join("")}
      ${giftBlock(item?.gift || null)}
      <div class="card mt row between" style="box-shadow:none"><span class="muted">Subtotal</span><b id="sub" style="font-size:1.15rem;color:var(--gold)"></b></div>
      <button class="btn block mt">${item ? "Save changes" : "🛒 Add to cart"}</button>
    </form>`, (m) => {
    const f = $("#cf", m);
    const calc = () => {
      const unit = unitPrice(p, formValues(f, fields));
      if ($("#each", m)) $("#each", m).textContent = money(unit);
      $("#sub", m).textContent = money(Math.max(0, Math.floor(Number(f.qty.value) || 0)) * unit);
    };
    f.addEventListener("input", calc); f.addEventListener("change", calc); calc();
    bindGift(f, fields, m);
    $$("[data-q]", m).forEach((b) => (b.onclick = () => {
      const n = Math.min(p.max_qty, Math.max(p.min_qty, Math.floor(Number(f.qty.value) || 0) + Number(b.dataset.q)));
      f.qty.value = n; calc();
    }));
    f.onsubmit = (e) => {
      e.preventDefault();
      const qty = Math.floor(Number(f.qty.value));
      if (!(qty >= p.min_qty && qty <= p.max_qty)) return toast(`Quantity must be ${p.min_qty}–${p.max_qty}.`, "error");
      const form = readForm(f, fields);
      if (!form) return;
      const gift = readGift(f);
      if (gift === false) return;
      if (!gift) rememberFields(fields, form);
      const cart = getCart();
      if (item) {
        const i = cart.findIndex((x) => x.uid === item.uid);
        if (i >= 0) cart[i] = { ...cart[i], quantity: qty, form, gift };
        setCart(cart); closeModal(); toast("Cart updated.", "success");
        if ((location.hash || "").slice(1) === "cart") route();
      } else {
        cart.push({ uid: Date.now().toString(36) + Math.random().toString(36).slice(2, 6), product: p.id, quantity: qty, form, gift });
        setCart(cart); closeModal();
        toast(`Added to cart (${cart.length} item${cart.length === 1 ? "" : "s"}).`, "success");
      }
    };
  });
}

    } catch (e) {
      S.cartPromo = null; disc = 0; pf.promo.readOnly = false; pBtn.textContent = "Apply";
      pMsg.innerHTML = `<span style="color:var(--red)">${esc(silent ? (code + ": " + errMsg(e)) : errMsg(e))}</span>`;
    }
    paint();
  };
  pBtn.onclick = () => {
    if (S.cartPromo) { S.cartPromo = null; disc = 0; pf.promo.value = ""; pf.promo.readOnly = false; pBtn.textContent = "Apply"; pMsg.innerHTML = ""; paint(); return; }
    const code = pf.promo.value.trim().toUpperCase();
    if (!code) return toast("Type a promo code.", "error");
    pBtn.disabled = true; pBtn.textContent = "…"; applyPromo(code, false).finally(() => (pBtn.disabled = false));
  };
  pf.promo.onkeydown = (e) => { if (e.key === "Enter") { e.preventDefault(); pBtn.click(); } };
  if (pf.usePts) pf.usePts.onchange = paint;
  paint();
  if (S.cartPromo && !bad) applyPromo(S.cartPromo.code, true);   // cart changed → check the code again
  $$("[data-del]", box).forEach((b) => (b.onclick = () => { setCart(getCart().filter((x) => x.uid !== b.dataset.del)); viewCart(v); }));
  $$("[data-edit]", box).forEach((b) => (b.onclick = () => {
    const it = getCart().find((x) => x.uid === b.dataset.edit);
    cartModal(S.products.find((x) => x.id == it.product), it);
  }));
  $("#clearCart").onclick = async () => {
    if (!(await confirmBox("Empty cart?", "All items will be removed from your cart.", "Empty cart", true))) return;
    setCart([]); viewCart(v);
  };
  $("#payAll").onclick = async () => {
    if (!(await confirmBox("Pay for everything?", `<b>${money(pay())}</b> will be deducted from your balance for <b>${cart.length}</b> item${cart.length === 1 ? "" : "s"}.${disc ? ` You save <b>${money(disc)}</b> with ${esc(S.cartPromo.code)}.` : ""}`, "Pay now"))) return;
    busy($("#payAll"), async () => {
      if (pay() > 0 && !(await requirePin(`Pay ${money(pay())}`))) return;
      const args = { p_items: cart.map((it) => ({ product: it.product, quantity: it.quantity, form: it.form || {}, ...(it.gift ? { gift: it.gift } : {}) })) };
      if (S.cartPromo) args.p_promo = S.cartPromo.code;
      if (pf.usePts?.checked) args.p_points = true;
      const { data, error } = await sb.rpc("place_cart", args);
      if (error) throw error;
      setCart([]); S.cartPromo = null;
      await loadProfile();
      $$("[data-balance]").forEach((el) => (el.textContent = money(S.profile.balance)));
      const ids = (data?.orders || []).map((x) => "#" + x).join(", ");
      openModal(`<div class="empty"><div class="big">✅</div><h2>Paid ${money(data?.total ?? pay())}</h2>
        ${Number(data?.discount) > 0 ? `<p class="small" style="color:var(--green)">You saved ${money(data.discount)} with ${esc(data.code)}.</p>` : ""}
        ${Number(data?.points) > 0 ? `<p class="small" style="color:var(--green)">⭐ ${data.points} points used.</p>` : ""}
        <p>${(data?.orders || []).length} orders placed: <b>${esc(ids)}</b>. You'll get a notification when each one is delivered.</p>
        <a class="btn block mt" href="#history" data-close>See my orders</a></div>`);
      viewCart(v);
    });
  };
}

/* ---------------- LOAD / WITHDRAW ---------------- */
function goBack() { if (history.length > 1) history.back(); else location.hash = "#home"; }
async function viewWallet(v, mode) {
  if (!mode) {
    v.innerHTML = `<h2>Wallet</h2>${walletButtons()}`;
    return;
  }
  const kind = mode === "deposit" ? "deposit" : "withdraw";
  const color = kind === "deposit" ? "var(--green)" : "var(--red)";
  v.innerHTML = `<div class="screen-head"><button class="back-btn" id="back" aria-label="Back">←</button>
    <h2 style="margin:0;color:${color}">${kind === "deposit" ? "Deposit" : "Withdraw"}</h2><span class="grow"></span>
    <span class="small muted">Balance <b data-balance>${money(S.profile.balance)}</b></span></div>
    <p class="small muted" id="pmHint" style="margin:-6px 0 8px">Choose a method</p>
    <div id="pmGrid" class="pm-grid"><div class="loader"></div></div>
    <div id="pmBody"></div>
    <div id="pmRecent"></div>`;
  let sel = null;
  // back: from a method → the method buttons; from the buttons → previous screen
  $("#back").onclick = () => { if (sel) { sel = null; clearInterval(S.timer); showGrid(); } else goBack(); };
  const { data } = await sb.from("payment_methods").select("*").eq("kind", kind).eq("active", true).order("sort").order("id");
  const methods = (data || []).filter((m) => kind !== "deposit" || m.audience !== "agents");
  if (!$("#pmGrid")) return;
  if (!methods.length) {
    $("#pmGrid").outerHTML = `<div class="empty"><div class="big">💳</div>No ${kind} methods available yet. Please contact <a href="${esc(tgLink())}" target="_blank" rel="noopener">${esc(tgHandle())}</a>.</div>`;
    return;
  }
  const drawGrid = () => {
    $("#pmGrid").innerHTML = methods.map((m) => `<button class="pm-tile" data-pm="${m.id}">
      <span class="pm-logo">${m.logo_url ? `<img src="${esc(m.logo_url)}" alt="">` : `<b>${esc(m.name.slice(0, 2).toUpperCase())}</b>`}</span>
      <span class="pm-name">${esc(m.name)}</span></button>`).join("");
    $$("[data-pm]", v).forEach((b) => (b.onclick = () => {
      sel = methods.find((m) => m.id == b.dataset.pm);
      clearInterval(S.timer); showMethod();
    }));
  };
  // Step 1: only the method buttons (+ my recent requests)
  const showGrid = () => {
    S.pmOpen = null;
    $("#pmGrid").classList.remove("hidden"); $("#pmHint").classList.remove("hidden");
    $("#pmBody").innerHTML = "";
    drawRecent(kind);
  };
  // Step 2: only the chosen method's details + form
  const showMethod = () => {
    S.pmOpen = { kind, id: sel.id };
    $("#pmGrid").classList.add("hidden"); $("#pmHint").classList.add("hidden");
    $("#pmRecent").innerHTML = "";
    const body = $("#pmBody");
    body.className = "slide-in";
    if (kind === "deposit") depositPanel(body, sel);
    else if (sel.code === "premviocash") renderPremvioCash(body);
    else payoutPanel(body, sel);
    window.scrollTo(0, 0);
  };
  drawGrid();
  // stay on the open method when the screen refreshes (e.g. after creating a PremvioCash code)
  const keep = S.pmOpen && S.pmOpen.kind === kind && methods.find((m) => m.id === S.pmOpen.id);
  if (keep) { sel = keep; showMethod(); } else showGrid();
}

function methodHead(m, sub) {
  return `<div class="row"><span class="pm-logo">${m.logo_url ? `<img src="${esc(m.logo_url)}" alt="">` : `<b>${esc(m.name.slice(0, 2).toUpperCase())}</b>`}</span>
    <div class="grow"><b style="font-size:1.05rem">${esc(m.name)}</b><div class="small muted">${sub}</div></div></div>
    ${m.details ? `<div class="pm-info mt">${esc(m.details)}</div>` : ""}`;
}
function limitsText(m, fallbackMin, fallbackMax) {
  const mn = m.min_amount ?? fallbackMin, mx = m.max_amount ?? fallbackMax;
  return [mn != null && mn !== "" ? "Min " + money(mn) : "", mx != null && mx !== "" ? "Max " + money(mx) : ""].filter(Boolean).join(" · ");
}

// Deposit: show account details, customer pays outside, then sends what the admin asks for
// (amount and screenshot are switched on/off per method by the admin)
function depositPanel(body, m) {
  const fields = m.fields || [];
  const askAmt = m.ask_amount !== false, proof = m.proof_mode || "required";
  body.innerHTML = `<div class="card pm-panel">
    ${methodHead(m, proof === "off" ? "Pay here, then send the form" : "Pay here, then upload the screenshot")}
    <div class="row wrap mt" style="gap:8px">
      ${m.details ? `<button class="btn sm soft" id="cpDet">${ICONS.copy} Copy details</button>` : ""}
      ${pvLinkBtn(m)}
      <button class="btn sm soft" onclick="copyText('${esc(S.profile.member_id)}')">${ICONS.copy} My ID ${esc(S.profile.member_id)}</button>
    </div>
    <form id="depf" class="mt">
      ${askAmt ? `<label>Amount you paid (${CFG.CURRENCY}) <span class="muted">${esc(limitsText(m))}</span></label>
      <input type="number" name="amount" min="${m.min_amount ?? 1}" ${m.max_amount != null ? `max="${m.max_amount}"` : ""} step="0.01" required inputmode="decimal">` : ""}
      ${fields.map((fd) => fieldInput(fd)).join("")}
      ${proof === "off" ? "" : `<label>Payment screenshot ${proof === "required" ? `<span style="color:var(--red)">*</span>` : `<span class="muted">(optional)</span>`}</label>
      <input type="file" name="proof" accept="image/*" ${proof === "required" ? "required" : ""}>
      <img id="proofPrev" class="doc-preview hidden" alt="">`}
      <button class="btn block deposit mt">Send for approval</button>
      <p class="small muted mt">We add the money to your balance after checking your payment. You'll get a notification.</p>
    </form></div>`;
  if ($("#cpDet")) $("#cpDet").onclick = () => copyText(m.details);
  const f = $("#depf");
  if (f.proof) f.proof.onchange = () => { const fl = f.proof.files[0]; if (fl) { $("#proofPrev").src = URL.createObjectURL(fl); $("#proofPrev").classList.remove("hidden"); } };
  f.onsubmit = (e) => {
    e.preventDefault();
    const amt = askAmt ? Number(f.amount.value) : null;
    if (askAmt && !(amt > 0)) return toast("Enter the amount you paid.", "error");
    const file = f.proof?.files?.[0] || null;
    if (proof === "required" && !file) return toast("Please add a screenshot of your payment.", "error");
    const form = readForm(f, fields);
    if (!form) return;
    busy($("button.btn", f), async () => {
      let path = null;
      if (file) {
        const blob = await compressImage(file);
        if (blob.size > 6 * 1024 * 1024) throw new Error("Screenshot is too large.");
        path = `${S.user.id}/dep-${Date.now()}.jpg`;
        const { error: upErr } = await sb.storage.from("proofs").upload(path, blob, { contentType: blob.type || "image/jpeg", upsert: false });
        if (upErr) throw upErr;
      }
      const { data, error } = await sb.rpc("request_deposit", { p_method: m.id, p_amount: amt, p_form: form, p_proof: path });
      if (error) throw error;
      rememberFields(fields, form);
      openModal(`<div class="empty"><div class="big">🧾</div><h2>Deposit #${data} sent</h2>
        <p>We're checking your payment${amt ? ` of <b>${money(amt)}</b>` : ""} via <b>${esc(m.name)}</b>. You'll get a notification when it's added to your balance.</p>
        <button class="btn block mt" data-close>OK</button></div>`);
      depositPanel(body, m);
    });
  };
}

// Withdraw via an admin-made method: amount + account details; money is held until admin pays
function payoutPanel(body, m) {
  const kyc = S.profile.kyc_status;
  if (kyc !== "approved") { body.innerHTML = `<div class="card">${kycGate()}</div>`; return; }
  const fields = m.fields || [];
  body.innerHTML = `<div class="card pm-panel">
    ${methodHead(m, "We send the money to your account")}
    <form id="payf" class="mt">
      <label>Amount (${CFG.CURRENCY}) <span class="muted">${esc(limitsText(m, S.settings.min_withdraw, S.settings.max_withdraw))}</span></label>
      <input type="number" name="amount" step="0.01" min="${m.min_amount ?? S.settings.min_withdraw ?? 1}" required inputmode="decimal">
      ${fields.map((fd) => fieldInput(fd)).join("")}
      <button class="btn block withdraw mt">Request withdrawal</button>
      <p class="small muted mt">The amount is taken from your balance now and sent to you after review. If we can't pay, it comes back to your balance.</p>
    </form></div>`;
  const f = $("#payf");
  f.onsubmit = (e) => {
    e.preventDefault();
    const amt = Number(f.amount.value);
    if (!(amt > 0)) return toast("Enter a valid amount.", "error");
    if (amt > Number(S.profile.balance)) return toast("Not enough balance.", "error");
    const form = readForm(f, fields);
    busy($("button.btn", f), async () => {
      if (!(await requirePin(`Withdraw ${money(amt)}`))) return;
      const { data, error } = await sb.rpc("request_payout", { p_method: m.id, p_amount: amt, p_form: form });
      if (error) throw error;
      rememberFields(fields, form);
      await loadProfile();
      $$("[data-balance]").forEach((el) => (el.textContent = money(S.profile.balance)));
      openModal(`<div class="empty"><div class="big">✅</div><h2>Withdrawal #${data} requested</h2>
        <p><b>${money(amt)}</b> via <b>${esc(m.name)}</b>. You'll get a notification when it's sent.</p>
        <button class="btn block mt" data-close>OK</button></div>`);
      payoutPanel(body, m);
    });
  };
}
function kycGate() {
  const kyc = S.profile.kyc_status;
  return `<div class="empty" style="padding:14px"><div class="big">🪪</div>
    <b>${kyc === "pending" ? "Your KYC is being reviewed" : "KYC verification required"}</b>
    <p class="muted small">${kyc === "pending" ? "You can withdraw once it is approved. We'll notify you." : "Complete KYC in Settings before you can withdraw."}</p>
    ${kyc === "pending" ? "" : `<a class="btn mt" href="#settings">Complete KYC</a>`}</div>`;
}
async function drawRecent(kind) {

// PremvioCash: city + street + 24-hour code paid by an agent
async function renderPremvioCash(body) {
  body.innerHTML = `<div class="card" id="wdCard"><div id="wd"><div class="loader"></div></div></div>`;
  const { data: active } = await sb.from("withdrawals").select("*").eq("status", "pending").order("created_at", { ascending: false });
  const wd = $("#wd");
  if (!wd) return;
  let html = "";
  (active || []).forEach((w) => {
    html += `<div class="code-box mb">
      <div class="small muted">Show this code to an agent</div>
      <div class="code mono">${esc(w.code)}</div>
      <div><b>${money(w.amount)}</b> · ${esc(w.city)}, ${esc(w.street)}</div>
      <div class="small mt" data-exp="${esc(w.expires_at)}" style="color:var(--orange);font-weight:700">${timeLeft(w.expires_at)}</div>
      <div class="row mt" style="justify-content:center">
        <button class="btn sm soft" onclick="copyText('${esc(w.code)}')">${ICONS.copy} Copy</button>
        <button class="btn sm ghost" data-cancel="${w.id}">Cancel &amp; refund</button>
      </div>
      <p class="small muted mt">If no agent pays you within the time limit, the money comes back to your balance automatically.</p>
    </div>`;
  });
  const kyc = S.profile.kyc_status;
  if (kyc !== "approved") {
    html += kycGate();
  } else if (!active?.length) {
    const min = Number(S.settings.min_withdraw || 0);
    html += `<form id="wf">
      <p class="muted small">You'll get a code valid for ${esc(S.settings.withdraw_hours || 24)} hours. An agent uses it to pay you cash.</p>
      <label>Amount (${CFG.CURRENCY})</label><input type="number" name="amount" min="${min}" step="0.01" required inputmode="decimal" placeholder="Minimum ${min}">
      <label>City</label><input name="city" required maxlength="60" placeholder="Type to search, e.g. P">
      <label>Street / area</label><input name="street" required maxlength="120" placeholder="Choose a city first">
      <p class="small muted" id="locHint"></p>
      <button class="btn block withdraw mt">Get withdrawal code</button></form>`;
  }
  wd.innerHTML = html;
  $$("[data-cancel]", wd).forEach((b) => (b.onclick = async () => {
    if (!(await confirmBox("Cancel withdrawal?", "The amount will go back to your balance.", "Cancel code", true))) return;
    const { error } = await sb.rpc("cancel_withdrawal", { p_id: Number(b.dataset.cancel) });
    if (error) return toast(errMsg(error), "error");
    toast("Cancelled and refunded.", "success"); await loadProfile(); route();
  }));
  const wf = $("#wf");
  let locs = [];
  const cities = () => [...new Set(locs.map((l) => l.city))];
  const sameCity = (a, b) => String(a || "").trim().toLowerCase() === String(b || "").trim().toLowerCase();
  const streets = () => locs.filter((l) => sameCity(l.city, wf.city.value) && l.street).map((l) => l.street);
  if (wf) {
    mountPicker(wf.city, cities, (v) => { if (v) { wf.street.value = ""; wf.street.placeholder = "Type to search streets"; wf.street.focus(); } });
    mountPicker(wf.street, streets);
    sb.rpc("withdraw_locations").then(({ data }) => {
      locs = data || [];
      $("#locHint").textContent = locs.length ? `Choose where to collect your cash — ${cities().length} cities with Premvio agents.` : "";
    });
  }
  if (wf) wf.onsubmit = (e) => {
    e.preventDefault();
    const amt = Number(wf.amount.value);
    if (amt > Number(S.profile.balance)) { toast("Not enough balance.", "error"); return; }
    if (locs.length) {
      const c = cities().find((x) => sameCity(x, wf.city.value));
      if (!c) { toast("Please choose a city from the list.", "error"); wf.city.focus(); return; }
      wf.city.value = c;
      const st = streets();
      if (st.length) {
        const s2 = st.find((x) => sameCity(x, wf.street.value));
        if (!s2) { toast("Please choose a street from the list.", "error"); wf.street.focus(); return; }
        wf.street.value = s2;
      }
    }
    busy($("button.btn", wf), async () => {
      if (!(await requirePin(`Withdraw ${money(amt)}`))) return;
      const { error } = await sb.rpc("request_withdrawal", { p_amount: amt, p_city: wf.city.value, p_street: wf.street.value });
      if (error) throw error;
      toast("Withdrawal code created.", "success");
      await loadProfile(); route();
    });
  };
  S.timer = setInterval(() => $$("[data-exp]").forEach((el) => (el.textContent = timeLeft(el.dataset.exp))), 30000);
}

/* ---------------- HISTORY ---------------- */
const TX_NAME = { deposit: "Deposit", load: "Deposit", adjust: "Admin adjustment", withdraw: "Withdrawal", purchase: "Purchase", refund: "Refund", agent_load: "Deposit to customer", agent_payout: "Withdrawal paid", bonus: "Bonus 🎉", voucher: "Gift voucher" };

function refundInfo(o) {
  if (o.refund_status === "requested") return `<div class="refund-box"><span class="badge requested">refund requested</span> We'll review it soon.<div class="muted">Your reason: ${esc(o.refund_reason || "")}</div></div>`;

  if (o.refund_status === "rejected") return `<div class="refund-box"><span class="badge rejected">refund rejected</span><div class="muted">${esc(o.refund_note || "")}</div></div>`;
  return "";
}
const REFUND_REASONS = ["Product not as described", "Not delivered / too slow", "Ordered by mistake", "Wrong quantity or details", "Other"];
function refundModal(o, view) {

// Step 1: "What problem are you facing?"  Step 2: details  →  chat page. An open chat opens straight away.
const HELP_TOPICS = [
  ["Order problem", "🛍️", "My order didn't arrive, is wrong or late"],
  ["Deposit problem", "💰", "I paid but my balance didn't update"],
  ["Withdrawal problem", "🏧", "A withdrawal or cash code problem"],
  ["Account / KYC", "🔐", "Login, KYC, PIN or account details"],
  ["Something else", "💬", "Any other question"],
];
async function viewHelp(v, id) {
  if (id) return helpThread(v, id);
  const pre = S.helpOrder;
  if (!pre && !S.helpNew) {
    const { data: open } = await sb.from("tickets").select("id").eq("status", "open").order("updated_at", { ascending: false }).limit(1);
    if (open && open.length) { location.replace("#help/" + open[0].id); return; }
  }

  if (pre) return helpDetails(v, "Order problem", pre);

    <div class="help-hero"><img src="${PV_LOGO}" alt=""><h2>What problem are you facing?</h2><p class="muted small">Choose one — then you can chat with us.</p></div>
    <div class="help-topics">${HELP_TOPICS.map(([t, ic, d]) => `<button class="help-topic" data-topic="${esc(t)}"><span class="ht-ic">${ic}</span>
      <span class="grow"><b>${esc(t)}</b><br><span class="small muted">${esc(d)}</span></span><em>›</em></button>`).join("")}</div>`;

  $$("[data-topic]", v).forEach((b) => (b.onclick = () => helpDetails(v, b.dataset.topic, null)));
}
async function helpDetails(v, topic, orderId) {
  S.helpOrder = null;
  const t = HELP_TOPICS.find((x) => x[0] === topic) || HELP_TOPICS[4];
  const { data: recent } = topic === "Order problem"
    ? await sb.from("orders").select("id, product_name, quantity, total, status, created_at").order("created_at", { ascending: false }).limit(10) : { data: [] };
  let sel = orderId || null;
  v.innerHTML = `<div class="screen-head"><button class="back-btn" id="back" aria-label="Back">←</button><h2 style="margin:0">${t[1]} ${esc(topic)}</h2></div>
    <form id="hdf" class="card">
      ${topic === "Order problem" ? `<label style="margin-top:0">Which order?</label>
        <div class="help-orders">${(recent || []).map((o) => `<button type="button" class="help-order ${sel === o.id ? "on" : ""}" data-oid="${o.id}">
          <b>#${o.id} ${esc(o.product_name)} × ${o.quantity}</b><span class="small muted">${money(o.total)} · ${esc(o.status)} · ${fmtDate(o.created_at)}</span></button>`).join("")}
          <button type="button" class="help-order ${sel ? "" : "on"}" data-oid=""><b>Not about one order</b></button></div>` : ""}
      <label ${topic === "Order problem" ? "" : `style="margin-top:0"`}>Describe your problem</label>
      <textarea name="body" required maxlength="1000" rows="4" placeholder="Tell us what happened…"></textarea>
      <button class="btn block mt wa-start">💬 Start chat</button></form>`;
  $("#back").onclick = () => viewHelp(v, null);
  $$("[data-oid]", v).forEach((b) => (b.onclick = () => { sel = b.dataset.oid ? Number(b.dataset.oid) : null; $$("[data-oid]", v).forEach((x) => x.classList.toggle("on", x === b)); }));
  $("#hdf").onsubmit = (e) => {
    e.preventDefault();
    const f = e.target;
    busy($(".wa-start", f), async () => {
      const { data, error } = await sb.rpc("open_ticket", { p_subject: topic, p_body: f.body.value, p_order: sel });
      if (error) throw error;
      location.hash = "help/" + data;
    });

}
function waDay(d) {
  const x = new Date(d), today = new Date(), y = new Date(Date.now() - 864e5);
  if (x.toDateString() === today.toDateString()) return "Today";
  if (x.toDateString() === y.toDateString()) return "Yesterday";
  return x.toLocaleDateString("en-GB", { day: "numeric", month: "short", year: "numeric" });
}
const waTime = (d) => new Date(d).toLocaleTimeString("en-GB", { hour: "2-digit", minute: "2-digit" });
async function helpThread(v, id) {
  const [{ data: t, error }, { data: msgs }] = await Promise.all([
    sb.from("tickets").select("*, orders(product_name, quantity)").eq("id", id).single(),
    sb.from("ticket_messages").select("*").eq("ticket_id", id).order("created_at")]);
  if (error || !t) { location.replace("#help"); return; }
  document.body.classList.add("wa-mode");
  const closed = t.status === "closed";
  v.innerHTML = `<div class="wa">
    <header class="wa-head"><button class="wa-back" id="back" aria-label="Back">←</button><img src="${PV_LOGO}" alt="">
      <div class="grow"><b>Premvio Support</b><div class="wa-sub">${closed ? "Solved ✅" : "Usually replies in a few minutes"}</div></div>
      ${closed ? "" : `<button class="wa-solved" id="solved">✅ Solved</button>`}</header>
    <div class="wa-topic">${esc(t.subject)}${t.orders ? ` · Order #${t.order_id} ${esc(t.orders.product_name)}` : ""}</div>
    <div class="wa-body" id="chat"><div class="wa-note">🔒 Messages are only between you and Premvio.</div></div>
    ${closed ? `<div class="wa-closed">This chat is solved. Need more help? <button class="btn sm" id="newChat">Start a new chat</button></div>` : ""}
    <form id="msgf" class="wa-input"><textarea name="m" rows="1" maxlength="1000" placeholder="Message" required></textarea>
      <button class="wa-send" aria-label="Send">${ICONS.send}</button></form></div>`;
  $("#back").onclick = () => (location.hash = "settings");
  const chat = $("#chat"), seen = new Set();
  let lastDay = "";
  const add = (m, pending) => {
    if (m.id && seen.has(m.id)) return; if (m.id) seen.add(m.id);
    const day = waDay(m.created_at);
    if (day !== lastDay) { chat.insertAdjacentHTML("beforeend", `<div class="wa-day"><span>${day}</span></div>`); lastDay = day; }
    chat.insertAdjacentHTML("beforeend", `<div class="wa-msg ${m.from_staff ? "in" : "out"}"><div class="wa-txt">${esc(m.body)}</div>
      <span class="wa-meta">${waTime(m.created_at)}${m.from_staff ? "" : ` <i class="wa-tick ${pending ? "" : "sent"}">${pending ? "🕓" : "✓✓"}</i>`}</span></div>`);
    chat.scrollTop = chat.scrollHeight;
  };
  (msgs || []).forEach((m) => add(m));
  if (S.helpCh) sb.removeChannel(S.helpCh);
  S.helpCh = sb.channel("help-" + id).on("postgres_changes", { event: "INSERT", schema: "public", table: "ticket_messages", filter: `ticket_id=eq.${id}` }, (x) => add(x.new)).subscribe();
  const f = $("#msgf"), ta = f.m;
  ta.oninput = () => { ta.style.height = "auto"; ta.style.height = Math.min(120, ta.scrollHeight) + "px"; };
  ta.onkeydown = (e) => { if (e.key === "Enter" && !e.shiftKey && !/Android|iPhone/i.test(navigator.userAgent)) { e.preventDefault(); f.requestSubmit(); } };
  f.onsubmit = async (e) => {
    e.preventDefault();
    const body = ta.value.trim(); if (!body) return;
    ta.value = ""; ta.style.height = "auto"; ta.focus();
    const { data: mid, error: er } = await sb.rpc("send_ticket_message", { p_ticket: id, p_body: body });
    if (er) { ta.value = body; return toast(errMsg(er), "error"); }
    add({ id: mid, from_staff: false, body, created_at: new Date().toISOString() });
    if (closed) route();
  };
  if ($("#solved")) $("#solved").onclick = async () => {
    if (!(await confirmBox("Problem solved?", "We'll close this chat. You can always start a new one from Help.", "Yes, solved"))) return;
    const { error: er } = await sb.rpc("close_ticket", { p_ticket: id });
    if (er) return toast(errMsg(er), "error");
    toast("Glad we could help! 🙌", "success"); route();
  };
  if ($("#newChat")) $("#newChat").onclick = () => { S.helpNew = true; location.hash = "help"; };
  setTimeout(() => (chat.scrollTop = chat.scrollHeight), 50);
}

/* ---------------- 🎟️ gift vouchers (Settings: buy + redeem; the list is in History → Vouchers) ---------------- */
async function shareVoucher(code, amt) {
  const text = `🎁 A Premvio gift voucher for you: ${code} (${money(amt)}). Open Premvio → Settings → Gift vouchers → Redeem. ${location.origin + location.pathname.replace(/index\.html$/, "")}`;
  if (navigator.share) { try { await navigator.share({ title: "Premvio gift voucher", text }); return; } catch (e) { if (e.name === "AbortError") return; } }
  copyText(text);
}
async function drawVouchers() {
  const box = $("#voucherCard");
  if (!box) return;
  const amounts = String(S.settings.voucher_amounts || "100,500,1000").split(",").map((x) => Number(x.trim())).filter((x) => x > 0);
  if (!document.body.contains(box)) return;
  box.innerHTML = `<h3 style="margin-top:0">🎟️ Gift vouchers</h3>
    <p class="small muted">Buy a voucher code with your balance and send it to a friend. They type the code here and the money goes to their balance.</p>
    <div class="v-amounts">${amounts.map((a) => `<button class="v-amt" data-buy="${a}"><b>${money(a)}</b><span>Buy voucher</span></button>`).join("")}</div>
    <form id="redeemF" class="mt"><label>Got a voucher code?</label>
      <div class="promo-box"><input name="code" placeholder="PVG-XXXX-XXXX-XXXX" maxlength="20" autocomplete="off"><button class="btn gold">Redeem</button></div></form>
    <p class="small muted mt">Your vouchers are in <a href="#history" data-vh>History → Vouchers</a>.</p>`;
  $("[data-vh]", box).onclick = () => { S.histTab = "vouchers"; };
  $$("[data-buy]", box).forEach((b) => (b.onclick = async () => {
    const amt = Number(b.dataset.buy);
    if (amt > Number(S.profile.balance)) return toast("Not enough balance for this voucher.", "error");
    if (!(await confirmBox("Buy gift voucher?", `<b>${money(amt)}</b> will be taken from your balance. You get a code to give to a friend.`, "Buy"))) return;
    if (!(await requirePin(`Buy voucher ${money(amt)}`))) return;
    const { data: r, error } = await sb.rpc("buy_voucher", { p_amount: amt });
    if (error) return toast(errMsg(error), "error");
    await loadProfile(); $$("[data-balance]").forEach((el) => (el.textContent = money(S.profile.balance)));
    openModal(`<div class="empty"><div class="big">🎟️</div><h2>Your voucher</h2>
      <div class="code-box mt"><div class="small muted">${money(r.amount)}</div><div class="code mono" style="font-size:1.25rem;letter-spacing:.06em">${esc(r.code)}</div></div>
      <p class="small muted mt">Send this code to your friend. Anyone who has it can use it once, so keep it private until you give it.</p>
      <button class="btn block gold mt" id="vShare">${ICONS.send} Share</button><button class="btn ghost block mt" data-close>Done</button>
      <p class="small muted mt">You can find it later in History → Vouchers.</p></div>`, (m) => { $("#vShare", m).onclick = () => shareVoucher(r.code, r.amount); });
    drawVouchers();
  }));
  $("#redeemF", box).onsubmit = (e) => {
    e.preventDefault();
    const code = e.target.code.value.trim();
    if (code.replace(/[^a-z0-9]/gi, "").length < 12) return toast("Type the full voucher code.", "error");
    busy($("button", e.target), async () => {
      const { data: r, error } = await sb.rpc("redeem_voucher", { p_code: code });
      if (error) throw error;
      if (!r.ok) throw new Error(r.message);
      e.target.reset(); await loadProfile(); $$("[data-balance]").forEach((el) => (el.textContent = money(S.profile.balance)));
      openModal(`<div class="empty"><div class="big">🎉</div><h2>${money(r.amount)} added!</h2><p>The voucher money is now in your balance.</p><button class="btn block mt" data-close>OK</button></div>`);
    });
  };
}

    if (l.innerHTML) { l.innerHTML = ""; return; }
    const { data } = await sb.from("points_log").select("*").order("created_at", { ascending: false }).limit(30);
    l.innerHTML = (data || []).length ? data.map((x) => `<div class="list-item"><div class="ic">⭐</div><div class="grow">${esc(x.reason)}
      <div class="small muted">${fmtDate(x.created_at)}</div></div><b class="${x.change >= 0 ? "amt-pos" : "amt-neg"}">${x.change >= 0 ? "+" : ""}${Number(x.change)}</b></div>`).join("")
      : `<p class="small muted">No points yet.</p>`;
  };
}

async function viewSettings(v) {
  const p = S.profile;
  const { data: kyc } = await sb.from("kyc").select("*").eq("user_id", p.id).maybeSingle();
  const kycBadge = { none: "Not submitted", pending: "Under review", approved: "Verified", rejected: "Rejected" }[p.kyc_status];
  v.innerHTML = `
  <h2>Settings</h2>
  <div class="card">
    <div class="row"><img src="${PV_LOGO}" style="width:52px"><div class="grow">
      <b>${esc(p.full_name)}</b><div class="small muted">${esc(p.email)}</div>
      <div class="small muted">${esc(p.phone || "")} · ${esc(p.country || "")}</div></div></div>
    <div class="id-row mt"><div><div class="small muted">Member ID</div><div class="mono id-big">${esc(p.member_id)}</div></div>
      <button class="btn sm soft" onclick="copyText('${esc(p.member_id)}')">${ICONS.copy} Copy</button></div>
  </div>

  <div class="card rewards-card" id="rewardsCard"><div class="loader"></div></div>

  <div class="card">
    <div class="row between"><h3 style="margin:0">Wallet</h3><span class="small muted">Balance <b data-balance>${money(p.balance)}</b></span></div>
    <div class="mt">${walletButtons()}</div>
  </div>

  <div class="card">
    <div class="row between"><h3 style="margin:0">KYC verification</h3><span class="badge ${p.kyc_status === "none" ? "" : p.kyc_status}">${kycBadge}</span></div>
    <div id="kycBox" class="mt"></div>
  </div>

  ${S.settings.voucher_on !== "false" ? `<div class="card" id="voucherCard"><div class="loader"></div></div>` : ""}

  ${S.settings.help_on !== "false" ? `<a class="card help-link" href="#help"><span class="hl-ic">💬</span><span class="grow"><b>Help chat</b><br><span class="small muted">Questions about an order, deposit or your account? Chat with us here.</span></span><em>›</em></a>` : ""}

  <div class="card">
    <h3>🔒 Security</h3>
    <div class="setting-row"><div><b>App PIN lock</b><div class="small muted">${p.has_pin ? "On — asked when you open the app and before paying" : "Ask a 4-number PIN to open the app and to pay"}</div></div>
      <div class="row" style="gap:6px">${p.has_pin ? `<button class="btn sm soft" id="pinChange">Change</button><button class="btn sm ghost" id="pinOff">Remove</button>` : `<button class="btn sm" id="pinSet">Set PIN</button>`}</div></div>
    <div class="setting-row"><div><b>My devices</b><div class="small muted">You get a notification when your account opens on a new device</div></div>
      <button class="btn sm soft" id="devs">See devices</button></div>
  </div>

  <div class="card">
    <h3>Preferences</h3>
    <div class="setting-row"><div><b>Light theme</b><div class="small muted">Switch between dark and light</div></div>
      <label class="switch" style="margin:0"><input type="checkbox" id="thm" ${p.theme === "light" ? "checked" : ""}><span></span></label></div>
    <div class="setting-row"><div><b>Notifications</b><div class="small muted">Push alerts on this device</div></div>
      <label class="switch" style="margin:0"><input type="checkbox" id="ntf" ${p.notify ? "checked" : ""}><span></span></label></div>
    <div class="setting-row"><div><b>Language</b><div class="small muted" data-notr>Language · भाषा</div></div>
      <div class="lang-seg" data-notr><button type="button" data-lang="en" class="${pvLang() === "en" ? "on" : ""}">English</button><button type="button" data-lang="ne" class="${pvLang() === "ne" ? "on" : ""}">नेपाली</button></div></div>
  </div>

  <div class="card">
    <h3>Account</h3>
    <div class="setting-row"><b>Password</b><button class="btn sm soft" id="chPass">Change</button></div>
    <div class="setting-row"><div><b>Email</b><div class="small muted">${esc(p.email)}</div></div><button class="btn sm soft" id="chMail">Change</button></div>
    <div class="setting-row"><div><b>Phone</b><div class="small muted">${esc(p.phone || "—")}</div></div><button class="btn sm soft" id="chPhone">Change</button></div>
    <div class="setting-row"><div><b>Install app</b><div class="small muted">Add Premvio to your home screen</div></div><button class="btn sm soft" id="inst">Install</button></div>
  </div>
  <button class="btn ghost block mt" id="logout">${ICONS.logout} Log out</button>
  <p class="center small muted mt">Need help? ${S.settings.help_on !== "false" ? `<a href="#help">💬 Chat with us</a> or ` : ""}<a href="${esc(tgLink())}" target="_blank" rel="noopener">${esc(tgHandle())}</a></p>`;

  // KYC
  drawRewards();
  drawVouchers();
  $$("[data-lang]", v).forEach((b) => (b.onclick = () => { if (b.dataset.lang !== pvLang()) pvSetLang(b.dataset.lang); }));
  if ($("#pinSet")) $("#pinSet").onclick = setPinModal;
  if ($("#pinChange")) $("#pinChange").onclick = setPinModal;
  if ($("#pinOff")) $("#pinOff").onclick = removePin;
  $("#devs").onclick = devicesModal;
  const kb = $("#kycBox");
  if (p.kyc_status === "approved" || p.kyc_status === "pending") {
    kb.innerHTML = kyc ? `<div class="small">
      <div class="setting-row"><span class="muted">Name</span><b>${esc(kyc.full_name)}</b></div>
      <div class="setting-row"><span class="muted">Document</span><b>${esc(kyc.doc_type)} · ${esc(kyc.doc_number)}</b></div>
      <div class="setting-row"><span class="muted">Region / City</span><b>${esc(kyc.region)}, ${esc(kyc.city)}</b></div></div>
      ${p.kyc_status === "pending" ? `<p class="small muted mt">We're reviewing your details. You'll be notified.</p>` : ""}` : "";
  } else {
    kb.innerHTML = `${p.kyc_status === "rejected" && kyc?.note ? `<p class="small" style="color:var(--red)">Reason: ${esc(kyc.note)}</p>` : ""}
      <p class="small muted">Required before you can withdraw money.</p>
      <form id="kf">
        <label>Full name (as on document)</label><input name="full_name" required value="${esc(kyc?.full_name || p.full_name)}">
        <label>Document type</label><select name="doc_type" required>
          ${["Citizenship", "Passport", "National ID", "Driving License", "Voter ID"].map((d) => `<option ${kyc?.doc_type === d ? "selected" : ""}>${d}</option>`).join("")}</select>
        <label>Document number</label><input name="doc_number" required value="${esc(kyc?.doc_number || "")}">
        <div class="grid-2"><div><label>Region / Province</label><input name="region" required value="${esc(kyc?.region || "")}"></div>
        <div><label>City</label><input name="city" required value="${esc(kyc?.city || "")}"></div></div>
        ${kyc?.photo_required ? `<div class="photo-ask">
          <b>📷 Photo of your document required</b>
          <div class="small muted">Take a clear photo of the front of your ${esc(kyc?.doc_type || "document")}. All text must be readable. Only Premvio admins can see it.</div>
          <input type="file" name="photo" accept="image/*" capture="environment" class="mt" required>
          <img id="docPrev" class="doc-preview hidden" alt=""></div>` : ""}
        <button class="btn block mt">Submit KYC</button>
      </form>`;
    if ($("#kf").photo) $("#kf").photo.onchange = (e) => {
      const fl = e.target.files[0], im = $("#docPrev");
      if (fl && im) { im.src = URL.createObjectURL(fl); im.classList.remove("hidden"); }
    };
    $("#kf").onsubmit = (e) => {
      e.preventDefault();
      const f = e.target;
      const file = f.photo?.files?.[0];
      if (kyc?.photo_required && !file) return toast("Please add a photo of your document.", "error");
      busy($("button.btn", f), async () => {
        let path = null;
        if (file) {
          const blob = await compressImage(file);
          if (blob.size > 6 * 1024 * 1024) throw new Error("Photo is too large. Please take it again.");
          path = `${p.id}/doc-${Date.now()}.jpg`;
          const { error: upErr } = await sb.storage.from("kyc").upload(path, blob, { contentType: blob.type || "image/jpeg", upsert: false });
          if (upErr) throw upErr;
        }
        const { error } = await sb.rpc("submit_kyc", { p_full_name: f.full_name.value, p_doc_type: f.doc_type.value,
          p_doc_number: f.doc_number.value, p_region: f.region.value, p_city: f.city.value, p_photo_path: path });
        if (error) throw error;
        toast("KYC submitted for review.", "success");
        await loadProfile(); route();
      });
    };
  }

  $("#thm").onchange = async (e) => {
    const t = e.target.checked ? "light" : "dark";
    applyTheme(t); S.profile.theme = t;
    await sb.from("profiles").update({ theme: t }).eq("id", p.id);
  };
  $("#ntf").onchange = async (e) => {
    const on = e.target.checked;
    if (on) {
      const ok = await enablePush();
      if (!ok) { e.target.checked = false; return; }
    } else {
      await disablePush();
    }
    await sb.from("profiles").update({ notify: on }).eq("id", p.id);
    S.profile.notify = on;
    toast(on ? "Notifications on." : "Notifications off.", "success");
  };
  $("#chPass").onclick = () => openModal(`<h2>Change password</h2><form id="cp">
      <label>Current password</label><input type="password" name="old" required>
      <label>New password</label><input type="password" name="n1" minlength="6" required>
      <label>Confirm new password</label><input type="password" name="n2" minlength="6" required>
      <button class="btn block mt">Save</button></form>`, (m) => {
    $("#cp", m).onsubmit = (e) => {
      e.preventDefault();
      const f = e.target;
      if (f.n1.value !== f.n2.value) return toast("New passwords don't match.", "error");
      busy($("button", f), async () => {
        const { error: e1 } = await sb.auth.signInWithPassword({ email: p.email, password: f.old.value });
        if (e1) throw new Error("Current password is wrong.");
        const { error } = await sb.auth.updateUser({ password: f.n1.value });
        if (error) throw error;
        closeModal(); toast("Password changed.", "success");
      });
    };
  });
  $("#chMail").onclick = () => openModal(`<h2>Change email</h2><form id="cm">
      <label>New email</label><input type="email" name="email" required>
      <p class="small muted mt">We'll send confirmation links to your old and new email. The change applies after you confirm.</p>
      <button class="btn block mt">Send confirmation</button></form>`, (m) => {
    $("#cm", m).onsubmit = (e) => {
      e.preventDefault();
      busy($("button", e.target), async () => {
        const { error } = await sb.auth.updateUser({ email: e.target.email.value.trim() }, { emailRedirectTo: location.origin + location.pathname });
        if (error) throw error;
        closeModal(); toast("Check your email to confirm the change.", "success");
      });
    };
  });
  $("#chPhone").onclick = () => openModal(`<h2>Change phone</h2><form id="cph">
      <label>New phone number</label><input type="tel" name="phone" required value="${esc(p.phone || "")}">
      <label>Country</label><select name="country">${countryOptions(p.country || "Nepal")}</select>
      <button class="btn block mt">Save</button></form>`, (m) => {
    $("#cph", m).onsubmit = (e) => {
      e.preventDefault();
      const f = e.target;
      if (!/^[+0-9 ()-]{7,20}$/.test(f.phone.value.trim())) return toast("Enter a valid phone number.", "error");
      busy($("button", f), async () => {
        const { error } = await sb.from("profiles").update({ phone: f.phone.value.trim(), country: f.country.value }).eq("id", p.id);
        if (error) throw error;
        await loadProfile(); closeModal(); toast("Phone updated.", "success"); route();
      });
    };
  });
  $("#inst").onclick = async () => {
    if (isStandalone()) return toast("Premvio is already installed.", "success");
    if (installEvt) { installEvt.prompt(); installEvt = null; return; }
    openModal(`<h2>Install Premvio</h2>
      <p><b>iPhone (Safari):</b> tap the Share button, then <b>Add to Home Screen</b>.</p>
      <p><b>Android (Chrome):</b> tap the ⋮ menu, then <b>Add to Home screen</b> or <b>Install app</b>.</p>
      <button class="btn block mt" data-close>Got it</button>`);
  };
  $("#logout").onclick = async () => {
    if (!(await confirmBox("Log out?", "You can log in again any time.", "Log out"))) return;
    await disablePush().catch(() => {});
    await pvSignOut();
    location.hash = "";
  };
}

</script>
</body>
</html>
